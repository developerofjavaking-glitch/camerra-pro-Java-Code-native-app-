name: Build Tic Tac Toe APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate High-Graphics Tic Tac Toe Code & Build APK
        run: |
          set -e

          # ১. ডিরেক্টরি তৈরি
          mkdir -p app/src/main/java/com/example/tictactoe
          mkdir -p app/src/main/res/drawable

          # ২. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "TicTacToe"
          include ':app'
          EOF

          # ৩. Root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          # ৪. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.tictactoe'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.tictactoe"
                  minSdk 21
                  targetSdk 34
                  versionCode 3
                  versionName "3.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          # ৫. Neon Cyber App Logo
          cat << 'EOF' > app/src/main/res/drawable/ic_app_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0E0A22"
                  android:pathData="M22,0 h64 a22,22 0 0 1 22,22 v64 a22,22 0 0 1 -22,22 h-64 a22,22 0 0 1 -22,-22 v-64 a22,22 0 0 1 22,-22 z" />
              <path
                  android:strokeColor="#2F255A"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M38,18 L38,90 M70,18 L70,90 M18,38 L90,38 M18,70 L90,70" />
              <path
                  android:strokeColor="#00F5FF"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:pathData="M22,22 L34,34 M34,22 L22,34" />
              <path
                  android:strokeColor="#FF2E93"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:pathData="M54,45 A9,9 0 1,0 54,63 A9,9 0 1,0 54,45" />
              <path
                  android:strokeColor="#00F5FF"
                  android:strokeWidth="6"
                  android:strokeLineCap="round"
                  android:pathData="M74,74 L86,86 M86,74 L74,86" />
          </vector>
          EOF

          # ৬. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_logo"
                  android:roundIcon="@drawable/ic_app_logo"
                  android:label="Tic Tac Toe"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ৭. MainActivity.java (উন্নত গ্রাফিক্স, সাউন্ড সিন্থেসাইজার ও অ্যানিমেশন)
          cat << 'EOF' > app/src/main/java/com/example/tictactoe/MainActivity.java
          package com.example.tictactoe;

          import android.app.Activity;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.media.AudioFormat;
          import android.media.AudioManager;
          import android.media.AudioTrack;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.animation.AccelerateDecelerateInterpolator;
          import android.widget.Button;
          import android.widget.GridLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          public class MainActivity extends Activity {
              private enum GameMode { PASS_AND_PLAY, VS_AI }
              private enum Difficulty { EASY, NORMAL, UNBEATABLE }

              private GameMode currentMode = GameMode.VS_AI;
              private Difficulty currentDifficulty = Difficulty.UNBEATABLE;

              private int[] board = new int[9]; // 0: empty, 1: X, 2: O
              private boolean isXTurn = true;
              private boolean gameOver = false;
              private boolean isAiThinking = false;
              private int movesCount = 0;
              private boolean soundEnabled = true;

              private int scoreX = 0;
              private int scoreO = 0;
              private int scoreDraw = 0;

              private Button[][] buttons = new Button[3][3];
              private TextView statusTextView;
              private TextView scoreXVal, scoreOVal, scoreDrawVal;
              private TextView scoreXLabel, scoreOLabel;
              private LinearLayout aiDifficultyContainer;
              private Button btnPassAndPlay, btnVsAi;
              private Button btnEasy, btnNormal, btnUnbeatable;
              private Button btnSoundToggle;
              private View statusCard;

              private final Handler handler = new Handler(Looper.getMainLooper());
              private final Random random = new Random();

              // Cyber Neon Colors
              private static final int COLOR_BG_TOP = 0xFF0B0819;
              private static final int COLOR_BG_BOTTOM = 0xFF161032;
              private static final int COLOR_CYAN = 0xFF00F5FF;
              private static final int COLOR_PINK = 0xFFFF2E93;
              private static final int COLOR_AMBER = 0xFFFFB703;
              private static final int COLOR_GOLD = 0xFFFFD700;
              private static final int COLOR_CARD = 0xFF181335;
              private static final int COLOR_BORDER = 0xFF2D2554;
              private static final int COLOR_TILE_DEFAULT = 0xFF1B1538;
              private static final int COLOR_TILE_BORDER = 0xFF352B68;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setFillViewport(true);

                  GradientDrawable appBg = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{COLOR_BG_TOP, COLOR_BG_BOTTOM}
                  );
                  scrollView.setBackground(appBg);

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setPadding(dp(18), dp(24), dp(18), dp(24));
                  scrollView.addView(root);

                  // Header Bar (Logo, Title, Sound Button)
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setLayoutParams(new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT
                  ));

                  ImageView logoView = new ImageView(this);
                  logoView.setImageResource(R.drawable.ic_app_logo);
                  int lSize = dp(44);
                  LinearLayout.LayoutParams lParams = new LinearLayout.LayoutParams(lSize, lSize);
                  logoView.setLayoutParams(lParams);
                  topBar.addView(logoView);

                  LinearLayout titleLayout = new LinearLayout(this);
                  titleLayout.setOrientation(LinearLayout.VERTICAL);
                  LinearLayout.LayoutParams titleParams = new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f
                  );
                  titleParams.setMargins(dp(12), 0, 0, 0);
                  titleLayout.setLayoutParams(titleParams);

                  TextView titleView = new TextView(this);
                  titleView.setText("TIC TAC TOE");
                  titleView.setTextSize(22);
                  titleView.setTypeface(Typeface.DEFAULT_BOLD);
                  titleView.setTextColor(Color.WHITE);
                  titleView.setShadowLayer(14, 0, 0, COLOR_CYAN);
                  titleLayout.addView(titleView);

                  TextView subTitleView = new TextView(this);
                  subTitleView.setText("CYBER NEON EDITION");
                  subTitleView.setTextSize(10);
                  subTitleView.setTextColor(0xFF8E89B2);
                  titleLayout.addView(subTitleView);
                  topBar.addView(titleLayout);

                  // Sound Button
                  btnSoundToggle = new Button(this);
                  btnSoundToggle.setText("SOUND ON");
                  btnSoundToggle.setTextSize(10);
                  btnSoundToggle.setTypeface(Typeface.DEFAULT_BOLD);
                  btnSoundToggle.setTextColor(COLOR_CYAN);
                  btnSoundToggle.setBackground(createPillDrawable(0xFF231C48, COLOR_CYAN, dp(14)));
                  btnSoundToggle.setPadding(dp(10), dp(4), dp(10), dp(4));
                  btnSoundToggle.setOnClickListener(v -> {
                      soundEnabled = !soundEnabled;
                      btnSoundToggle.setText(soundEnabled ? "SOUND ON" : "MUTED");
                      btnSoundToggle.setTextColor(soundEnabled ? COLOR_CYAN : 0xFF8E89B2);
                      btnSoundToggle.setBackground(createPillDrawable(0xFF231C48, soundEnabled ? COLOR_CYAN : 0xFF433B6A, dp(14)));
                      if (soundEnabled) playSound(new double[]{600, 800}, new int[]{25, 30});
                  });
                  topBar.addView(btnSoundToggle);
                  root.addView(topBar);

                  addSpacing(root, 16);

                  // Mode Selector: Segmented Pill Container
                  LinearLayout modeContainer = new LinearLayout(this);
                  modeContainer.setOrientation(LinearLayout.HORIZONTAL);
                  modeContainer.setGravity(Gravity.CENTER);
                  modeContainer.setBackground(createPillDrawable(0xFF140F2C, COLOR_BORDER, dp(24)));
                  modeContainer.setPadding(dp(4), dp(4), dp(4), dp(4));
                  LinearLayout.LayoutParams modeParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  modeContainer.setLayoutParams(modeParams);

                  btnPassAndPlay = createSegmentButton("PASS & PLAY");
                  btnVsAi = createSegmentButton("AI BATTLE");

                  btnPassAndPlay.setOnClickListener(v -> setGameMode(GameMode.PASS_AND_PLAY));
                  btnVsAi.setOnClickListener(v -> setGameMode(GameMode.VS_AI));

                  modeContainer.addView(btnPassAndPlay);
                  modeContainer.addView(btnVsAi);
                  root.addView(modeContainer);

                  addSpacing(root, 10);

                  // AI Difficulty Chips
                  aiDifficultyContainer = new LinearLayout(this);
                  aiDifficultyContainer.setOrientation(LinearLayout.HORIZONTAL);
                  aiDifficultyContainer.setGravity(Gravity.CENTER);

                  btnEasy = createDifficultyButton("EASY");
                  btnNormal = createDifficultyButton("NORMAL");
                  btnUnbeatable = createDifficultyButton("UNBEATABLE");

                  btnEasy.setOnClickListener(v -> setDifficulty(Difficulty.EASY));
                  btnNormal.setOnClickListener(v -> setDifficulty(Difficulty.NORMAL));
                  btnUnbeatable.setOnClickListener(v -> setDifficulty(Difficulty.UNBEATABLE));

                  aiDifficultyContainer.addView(btnEasy);
                  aiDifficultyContainer.addView(btnNormal);
                  aiDifficultyContainer.addView(btnUnbeatable);
                  root.addView(aiDifficultyContainer);

                  addSpacing(root, 12);

                  // Scoreboard Card
                  LinearLayout scoreCard = new LinearLayout(this);
                  scoreCard.setOrientation(LinearLayout.HORIZONTAL);
                  scoreCard.setBackground(createCardDrawable(COLOR_CARD, COLOR_BORDER, dp(16)));
                  scoreCard.setPadding(dp(12), dp(12), dp(12), dp(12));
                  LinearLayout.LayoutParams scoreCardParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT
                  );
                  scoreCard.setLayoutParams(scoreCardParams);

                  scoreXLabel = new TextView(this);
                  scoreXVal = new TextView(this);
                  scoreCard.addView(createScoreColumn(scoreXLabel, scoreXVal, "YOU (X)", COLOR_CYAN));

                  TextView drawLabel = new TextView(this);
                  scoreDrawVal = new TextView(this);
                  scoreCard.addView(createScoreColumn(drawLabel, scoreDrawVal, "TIES", 0xFFA09CC2));

                  scoreOLabel = new TextView(this);
                  scoreOVal = new TextView(this);
                  scoreCard.addView(createScoreColumn(scoreOLabel, scoreOVal, "AI (O)", COLOR_PINK));

                  root.addView(scoreCard);

                  addSpacing(root, 12);

                  // Turn Status Banner
                  statusCard = new LinearLayout(this);
                  ((LinearLayout) statusCard).setOrientation(LinearLayout.HORIZONTAL);
                  ((LinearLayout) statusCard).setGravity(Gravity.CENTER);
                  statusCard.setBackground(createCardDrawable(0xFF1E1742, 0xFF4A3A86, dp(20)));
                  statusCard.setPadding(dp(16), dp(8), dp(16), dp(8));

                  statusTextView = new TextView(this);
                  statusTextView.setTextSize(16);
                  statusTextView.setTypeface(Typeface.DEFAULT_BOLD);
                  statusTextView.setTextColor(COLOR_CYAN);
                  statusTextView.setGravity(Gravity.CENTER);
                  ((LinearLayout) statusCard).addView(statusTextView);
                  root.addView(statusCard);

                  addSpacing(root, 14);

                  // 3x3 Game Board Grid
                  LinearLayout boardContainer = new LinearLayout(this);
                  boardContainer.setOrientation(LinearLayout.VERTICAL);
                  boardContainer.setGravity(Gravity.CENTER);
                  boardContainer.setBackground(createCardDrawable(0xFF130E29, 0xFF352B66, dp(22)));
                  boardContainer.setPadding(dp(10), dp(10), dp(10), dp(10));

                  GridLayout gridLayout = new GridLayout(this);
                  gridLayout.setRowCount(3);
                  gridLayout.setColumnCount(3);
                  gridLayout.setAlignmentMode(GridLayout.ALIGN_BOUNDS);

                  int btnSize = dp(90);

                  for (int i = 0; i < 3; i++) {
                      for (int j = 0; j < 3; j++) {
                          final int row = i;
                          final int col = j;
                          Button btn = new Button(this);
                          btn.setTextSize(44);
                          btn.setTypeface(Typeface.DEFAULT_BOLD);
                          btn.setTextColor(Color.WHITE);
                          btn.setBackground(createTileDrawable(COLOR_TILE_DEFAULT, COLOR_TILE_BORDER));

                          GridLayout.LayoutParams params = new GridLayout.LayoutParams();
                          params.width = btnSize;
                          params.height = btnSize;
                          params.setMargins(dp(5), dp(5), dp(5), dp(5));
                          btn.setLayoutParams(params);

                          btn.setOnClickListener(v -> onCellClicked(row, col));

                          buttons[i][j] = btn;
                          gridLayout.addView(btn);
                      }
                  }
                  boardContainer.addView(gridLayout);
                  root.addView(boardContainer);

                  addSpacing(root, 18);

                  // Restart Game Button
                  Button resetBtn = new Button(this);
                  resetBtn.setText("RESTART GAME");
                  resetBtn.setTextSize(15);
                  resetBtn.setTypeface(Typeface.DEFAULT_BOLD);
                  resetBtn.setTextColor(Color.WHITE);
                  resetBtn.setShadowLayer(10, 0, 0, 0x88FF2E93);
                  resetBtn.setBackground(createGradientButton(0xFFFF2E93, 0xFFFF5376, dp(24)));
                  LinearLayout.LayoutParams resetParams = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, dp(48)
                  );
                  resetParams.setMargins(dp(16), 0, dp(16), 0);
                  resetBtn.setLayoutParams(resetParams);
                  resetBtn.setOnClickListener(v -> {
                      playTapSound(480);
                      resetBoard();
                  });
                  root.addView(resetBtn);

                  setContentView(scrollView);

                  updateModeUI();
                  updateScoreUI();
                  resetBoard();
              }

              private void addSpacing(LinearLayout parent, int dp) {
                  View spacer = new View(this);
                  spacer.setLayoutParams(new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dp(dp)));
                  parent.addView(spacer);
              }

              private int dp(int value) {
                  return (int) (getResources().getDisplayMetrics().density * value);
              }

              private View createScoreColumn(TextView label, TextView val, String defaultText, int accentColor) {
                  LinearLayout col = new LinearLayout(this);
                  col.setOrientation(LinearLayout.VERTICAL);
                  col.setGravity(Gravity.CENTER);
                  col.setLayoutParams(new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f));

                  label.setText(defaultText);
                  label.setTextSize(11);
                  label.setTypeface(Typeface.DEFAULT_BOLD);
                  label.setTextColor(0xFF8E89B2);
                  col.addView(label);

                  val.setText("0");
                  val.setTextSize(24);
                  val.setTypeface(Typeface.DEFAULT_BOLD);
                  val.setTextColor(accentColor);
                  col.addView(val);

                  return col;
              }

              private Button createSegmentButton(String text) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setTextSize(13);
                  btn.setTypeface(Typeface.DEFAULT_BOLD);
                  LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(0, dp(40), 1.0f);
                  btn.setLayoutParams(params);
                  return btn;
              }

              private Button createDifficultyButton(String text) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setTextSize(12);
                  btn.setTypeface(Typeface.DEFAULT_BOLD);
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          ViewGroup.LayoutParams.WRAP_CONTENT, dp(34)
                  );
                  p.setMargins(dp(4), 0, dp(4), 0);
                  btn.setLayoutParams(p);
                  btn.setPadding(dp(16), 0, dp(16), 0);
                  return btn;
              }

              private GradientDrawable createPillDrawable(int bgColor, int strokeColor, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(bgColor);
                  d.setCornerRadius(radius);
                  if (strokeColor != 0) {
                      d.setStroke(dp(1), strokeColor);
                  }
                  return d;
              }

              private GradientDrawable createCardDrawable(int bgColor, int strokeColor, int radius) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(bgColor);
                  d.setCornerRadius(radius);
                  if (strokeColor != 0) {
                      d.setStroke(dp(1), strokeColor);
                  }
                  return d;
              }

              private GradientDrawable createTileDrawable(int bgColor, int strokeColor) {
                  GradientDrawable d = new GradientDrawable();
                  d.setColor(bgColor);
                  d.setCornerRadius(dp(16));
                  d.setStroke(dp(2), strokeColor);
                  return d;
              }

              private GradientDrawable createGradientButton(int startColor, int endColor, int radius) {
                  GradientDrawable d = new GradientDrawable(
                          GradientDrawable.Orientation.LEFT_RIGHT,
                          new int[]{startColor, endColor}
                  );
                  d.setCornerRadius(radius);
                  return d;
              }

              private void setGameMode(GameMode mode) {
                  if (currentMode != mode) {
                      currentMode = mode;
                      scoreX = 0;
                      scoreO = 0;
                      scoreDraw = 0;
                      playTapSound(520);
                      updateModeUI();
                      updateScoreUI();
                      resetBoard();
                  }
              }

              private void setDifficulty(Difficulty diff) {
                  currentDifficulty = diff;
                  playTapSound(600);
                  updateModeUI();
                  resetBoard();
              }

              private void updateModeUI() {
                  if (currentMode == GameMode.PASS_AND_PLAY) {
                      btnPassAndPlay.setBackground(createGradientButton(0xFF6C5CE7, 0xFFA29BFE, dp(20)));
                      btnPassAndPlay.setTextColor(Color.WHITE);
                      btnVsAi.setBackgroundColor(Color.TRANSPARENT);
                      btnVsAi.setTextColor(0xFF8E89B2);
                      aiDifficultyContainer.setVisibility(View.GONE);
                      scoreXLabel.setText("PLAYER X");
                      scoreOLabel.setText("PLAYER O");
                  } else {
                      btnVsAi.setBackground(createGradientButton(0xFF6C5CE7, 0xFFA29BFE, dp(20)));
                      btnVsAi.setTextColor(Color.WHITE);
                      btnPassAndPlay.setBackgroundColor(Color.TRANSPARENT);
                      btnPassAndPlay.setTextColor(0xFF8E89B2);
                      aiDifficultyContainer.setVisibility(View.VISIBLE);
                      scoreXLabel.setText("YOU (X)");
                      scoreOLabel.setText("AI (O)");
                      updateDifficultyUI();
                  }
              }

              private void updateDifficultyUI() {
                  int inactiveBg = 0xFF1B1538;
                  int inactiveText = 0xFF7D77A0;

                  btnEasy.setBackground(currentDifficulty == Difficulty.EASY ?
                          createPillDrawable(0xFF00B894, 0xFF55EFC4, dp(17)) :
                          createPillDrawable(inactiveBg, COLOR_BORDER, dp(17)));
                  btnEasy.setTextColor(currentDifficulty == Difficulty.EASY ? Color.WHITE : inactiveText);

                  btnNormal.setBackground(currentDifficulty == Difficulty.NORMAL ?
                          createPillDrawable(0xFFE17055, 0xFFFAB1A0, dp(17)) :
                          createPillDrawable(inactiveBg, COLOR_BORDER, dp(17)));
                  btnNormal.setTextColor(currentDifficulty == Difficulty.NORMAL ? Color.WHITE : inactiveText);

                  btnUnbeatable.setBackground(currentDifficulty == Difficulty.UNBEATABLE ?
                          createPillDrawable(0xFFFF2E93, 0xFFFF7675, dp(17)) :
                          createPillDrawable(inactiveBg, COLOR_BORDER, dp(17)));
                  btnUnbeatable.setTextColor(currentDifficulty == Difficulty.UNBEATABLE ? Color.WHITE : inactiveText);
              }

              private void updateScoreUI() {
                  scoreXVal.setText(String.valueOf(scoreX));
                  scoreOVal.setText(String.valueOf(scoreO));
                  scoreDrawVal.setText(String.valueOf(scoreDraw));
              }

              private void onCellClicked(int r, int c) {
                  int index = r * 3 + c;
                  if (gameOver || isAiThinking || board[index] != 0) {
                      return;
                  }

                  makeMove(r, c, isXTurn ? 1 : 2);
                  playMoveSound(isXTurn);

                  if (checkGameStatus()) {
                      return;
                  }

                  isXTurn = !isXTurn;

                  if (currentMode == GameMode.VS_AI && !isXTurn) {
                      isAiThinking = true;
                      statusTextView.setText("AI CALCULATING...");
                      statusTextView.setTextColor(COLOR_AMBER);

                      handler.postDelayed(() -> {
                          if (!gameOver) {
                              makeAiMove();
                              playMoveSound(false);
                              isAiThinking = false;
                              if (!checkGameStatus()) {
                                  isXTurn = true;
                                  statusTextView.setText("YOUR TURN (X)");
                                  statusTextView.setTextColor(COLOR_CYAN);
                              }
                          }
                      }, 380);
                  } else {
                      statusTextView.setText(isXTurn ? "PLAYER X'S TURN" : "PLAYER O'S TURN");
                      statusTextView.setTextColor(isXTurn ? COLOR_CYAN : COLOR_PINK);
                  }
              }

              private void makeMove(int r, int c, int player) {
                  int index = r * 3 + c;
                  board[index] = player;
                  movesCount++;

                  Button btn = buttons[r][c];
                  btn.setScaleX(0.7f);
                  btn.setScaleY(0.7f);
                  btn.animate().scaleX(1.0f).scaleY(1.0f).setDuration(200)
                          .setInterpolator(new AccelerateDecelerateInterpolator()).start();

                  if (player == 1) {
                      btn.setText("X");
                      btn.setTextColor(COLOR_CYAN);
                      btn.setShadowLayer(18, 0, 0, COLOR_CYAN);
                      btn.setBackground(createTileDrawable(0xFF1E2748, COLOR_CYAN));
                  } else {
                      btn.setText("O");
                      btn.setTextColor(COLOR_PINK);
                      btn.setShadowLayer(18, 0, 0, COLOR_PINK);
                      btn.setBackground(createTileDrawable(0xFF381B3C, COLOR_PINK));
                  }
              }

              private boolean checkGameStatus() {
                  int[] winLine = getWinningLine();
                  if (winLine != null) {
                      gameOver = true;
                      int winner = board[winLine[0]];
                      highlightWinningLine(winLine);

                      if (winner == 1) {
                          scoreX++;
                          String title = currentMode == GameMode.VS_AI ? "VICTORY! YOU WON!" : "PLAYER X WINS!";
                          statusTextView.setText(title);
                          statusTextView.setTextColor(COLOR_GOLD);
                          playWinSound();
                      } else {
                          scoreO++;
                          String title = currentMode == GameMode.VS_AI ? "AI DOMINATES!" : "PLAYER O WINS!";
                          statusTextView.setText(title);
                          statusTextView.setTextColor(COLOR_PINK);
                          playDefeatSound();
                      }
                      updateScoreUI();
                      return true;
                  }

                  if (movesCount == 9) {
                      gameOver = true;
                      scoreDraw++;
                      statusTextView.setText("MATCH TIED - DRAW!");
                      statusTextView.setTextColor(0xFFCDD6F4);
                      playDrawSound();
                      updateScoreUI();
                      return true;
                  }

                  return false;
              }

              private void highlightWinningLine(int[] line) {
                  for (int idx : line) {
                      int r = idx / 3;
                      int c = idx % 3;
                      Button b = buttons[r][c];
                      b.setBackground(createTileDrawable(0xFF43350C, COLOR_GOLD));
                      b.setTextColor(COLOR_GOLD);
                      b.setShadowLayer(25, 0, 0, COLOR_GOLD);
                      b.animate().scaleX(1.1f).scaleY(1.1f).setDuration(250).start();
                  }
              }

              private void makeAiMove() {
                  int bestMove = -1;

                  if (currentDifficulty == Difficulty.EASY) {
                      bestMove = getRandomMove();
                  } else if (currentDifficulty == Difficulty.NORMAL) {
                      bestMove = getWinningOrBlockingMove(2);
                      if (bestMove == -1) {
                          bestMove = getWinningOrBlockingMove(1);
                      }
                      if (bestMove == -1) {
                          bestMove = random.nextBoolean() ? findBestMinimaxMove() : getRandomMove();
                      }
                  } else {
                      bestMove = findBestMinimaxMove();
                  }

                  if (bestMove != -1) {
                      int r = bestMove / 3;
                      int c = bestMove % 3;
                      makeMove(r, c, 2);
                  }
              }

              private int getRandomMove() {
                  List<Integer> emptyIndices = new ArrayList<>();
                  for (int i = 0; i < 9; i++) {
                      if (board[i] == 0) emptyIndices.add(i);
                  }
                  if (emptyIndices.isEmpty()) return -1;
                  return emptyIndices.get(random.nextInt(emptyIndices.size()));
              }

              private int getWinningOrBlockingMove(int player) {
                  for (int i = 0; i < 9; i++) {
                      if (board[i] == 0) {
                          board[i] = player;
                          boolean wins = (getWinningLine() != null && board[getWinningLine()[0]] == player);
                          board[i] = 0;
                          if (wins) return i;
                      }
                  }
                  return -1;
              }

              private int findBestMinimaxMove() {
                  int bestVal = -1000;
                  int bestMove = -1;
                  for (int i = 0; i < 9; i++) {
                      if (board[i] == 0) {
                          board[i] = 2;
                          int moveVal = minimax(0, false);
                          board[i] = 0;
                          if (moveVal > bestVal) {
                              bestMove = i;
                              bestVal = moveVal;
                          }
                      }
                  }
                  return bestMove != -1 ? bestMove : getRandomMove();
              }

              private int minimax(int depth, boolean isMax) {
                  int[] winLine = getWinningLine();
                  if (winLine != null) {
                      int winner = board[winLine[0]];
                      if (winner == 2) return 10 - depth;
                      if (winner == 1) return -10 + depth;
                  }
                  if (isBoardFull()) return 0;

                  if (isMax) {
                      int best = -1000;
                      for (int i = 0; i < 9; i++) {
                          if (board[i] == 0) {
                              board[i] = 2;
                              best = Math.max(best, minimax(depth + 1, false));
                              board[i] = 0;
                          }
                      }
                      return best;
                  } else {
                      int best = 1000;
                      for (int i = 0; i < 9; i++) {
                          if (board[i] == 0) {
                              board[i] = 1;
                              best = Math.min(best, minimax(depth + 1, true));
                              board[i] = 0;
                          }
                      }
                      return best;
                  }
              }

              private boolean isBoardFull() {
                  for (int i = 0; i < 9; i++) {
                      if (board[i] == 0) return false;
                  }
                  return true;
              }

              private int[] getWinningLine() {
                  int[][] lines = {
                          {0, 1, 2}, {3, 4, 5}, {6, 7, 8},
                          {0, 3, 6}, {1, 4, 7}, {2, 5, 8},
                          {0, 4, 8}, {2, 4, 6}
                  };
                  for (int[] line : lines) {
                      if (board[line[0]] != 0 && board[line[0]] == board[line[1]] && board[line[1]] == board[line[2]]) {
                          return line;
                      }
                  }
                  return null;
              }

              private void resetBoard() {
                  for (int i = 0; i < 9; i++) {
                      board[i] = 0;
                  }
                  for (int i = 0; i < 3; i++) {
                      for (int j = 0; j < 3; j++) {
                          Button b = buttons[i][j];
                          b.setText("");
                          b.setScaleX(1.0f);
                          b.setScaleY(1.0f);
                          b.setBackground(createTileDrawable(COLOR_TILE_DEFAULT, COLOR_TILE_BORDER));
                      }
                  }
                  isXTurn = true;
                  gameOver = false;
                  isAiThinking = false;
                  movesCount = 0;

                  if (currentMode == GameMode.VS_AI) {
                      statusTextView.setText("YOUR TURN (X)");
                  } else {
                      statusTextView.setText("PLAYER X'S TURN");
                  }
                  statusTextView.setTextColor(COLOR_CYAN);
              }

              // --- SYNTHESIZED SOUND EFFECTS ---
              private void playMoveSound(boolean isX) {
                  if (!soundEnabled) return;
                  if (isX) {
                      playSound(new double[]{587.33, 880.0}, new int[]{35, 45});
                  } else {
                      playSound(new double[]{440.0, 349.23}, new int[]{40, 50});
                  }
              }

              private void playTapSound(double freq) {
                  if (!soundEnabled) return;
                  playSound(new double[]{freq}, new int[]{35});
              }

              private void playWinSound() {
                  if (!soundEnabled) return;
                  playSound(new double[]{523.25, 659.25, 783.99, 1046.5}, new int[]{70, 70, 70, 140});
              }

              private void playDefeatSound() {
                  if (!soundEnabled) return;
                  playSound(new double[]{493.88, 440.0, 392.0, 329.63}, new int[]{65, 65, 65, 120});
              }

              private void playDrawSound() {
                  if (!soundEnabled) return;
                  playSound(new double[]{440.0, 370.0, 311.13}, new int[]{80, 80, 110});
              }

              private void playSound(final double[] freqs, final int[] durationsMs) {
                  new Thread(() -> {
                      try {
                          int sampleRate = 22050;
                          int totalSamples = 0;
                          for (int d : durationsMs) {
                              totalSamples += (sampleRate * d) / 1000;
                          }
                          short[] buffer = new short[totalSamples];
                          int idx = 0;
                          for (int i = 0; i < freqs.length; i++) {
                              double freq = freqs[i];
                              int samples = (sampleRate * durationsMs[i]) / 1000;
                              for (int s = 0; s < samples; s++) {
                                  double env = 1.0;
                                  int rampUp = (int) (sampleRate * 0.005);
                                  int rampDown = (int) (sampleRate * 0.012);
                                  if (s < rampUp) {
                                      env = (double) s / rampUp;
                                  } else if (s > samples - rampDown) {
                                      env = (double) (samples - s) / rampDown;
                                  }
                                  double angle = 2.0 * Math.PI * s * freq / sampleRate;
                                  buffer[idx++] = (short) (Math.sin(angle) * 32767 * 0.35 * env);
                              }
                          }
                          AudioTrack track = new AudioTrack(
                                  AudioManager.STREAM_MUSIC,
                                  sampleRate,
                                  AudioFormat.CHANNEL_OUT_MONO,
                                  AudioFormat.ENCODING_PCM_16BIT,
                                  buffer.length * 2,
                                  AudioTrack.MODE_STATIC
                          );
                          track.write(buffer, 0, buffer.length);
                          track.play();
                          handler.postDelayed(() -> {
                              try {
                                  track.stop();
                                  track.release();
                              } catch (Exception ignored) {}
                          }, (totalSamples * 1000 / sampleRate) + 300);
                      } catch (Exception ignored) {}
                  }).start();
              }
          }
