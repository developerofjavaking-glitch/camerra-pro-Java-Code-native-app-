name: Build Camera Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Camera Pro Project & Build APK
        run: |
          set -e

          mkdir -p app/src/main/java/com/camerrapro/aijavadevs
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/values

          # --- Fix: Enable AndroidX ---
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CameraPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.camerrapro.aijavadevs'
              compileSdk 34

              defaultConfig {
                  applicationId "com.camerrapro.aijavadevs"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.camera:camera-core:1.3.4"
              implementation "androidx.camera:camera-camera2:1.3.4"
              implementation "androidx.camera:camera-lifecycle:1.3.4"
              implementation "androidx.camera:camera-view:1.3.4"
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Camera Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#FFFFFF</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_camera_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#111111"
                  android:pathData="M22,28 L34,28 L40,20 L68,20 L74,28 L86,28 C91,28 95,32 95,37 L95,79 C95,84 91,88 86,88 L22,88 C17,88 13,84 13,79 L13,37 C13,32 17,28 22,28 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,36 A18,18 0,1 0,54 72 A18,18 0,1 0,54 36 M54,43 A11,11 0,1 1,54 65 A11,11 0,1 1,54 43 Z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M79,36 A5,5 0,1 0,79 46 A5,5 0,1 0,79 36" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_camera_logo"
                  android:roundIcon="@drawable/ic_camera_logo"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/camerrapro/aijavadevs/MainActivity.java
          package com.camerrapro.aijavadevs;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.media.MediaActionSound;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageButton;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.camera.core.Camera;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.FocusMeteringAction;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.MeteringPoint;
          import androidx.camera.core.MeteringPointFactory;
          import androidx.camera.core.Preview;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.concurrent.ExecutionException;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends Activity {

              private static final int CAMERA_PERMISSION = 1001;

              private PreviewView previewView;
              private ImageCapture imageCapture;
              private Camera camera;
              private CameraSelector cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA;
              private boolean frontCamera = false;
              private boolean flashEnabled = false;
              private int timerSeconds = 0;
              private boolean capturing = false;

              private TextView zoomText;
              private TextView timerText;
              private TextView flashText;
              private ImageButton flashButton;
              private ImageButton switchButton;
              private Button timerButton;
              private SeekBar zoomSeekBar;

              private final MediaActionSound shutterSound = new MediaActionSound();

              private static final int WHITE = Color.WHITE;
              private static final int LIGHT = 0xFFD7D7D7;
              private static final int PANEL = 0xB5000000;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  shutterSound.load(MediaActionSound.SHUTTER_CLICK);

                  buildUi();

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          == PackageManager.PERMISSION_GRANTED) {
                      startCamera();
                  } else {
                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION
                      );
                  }
              }

              private void buildUi() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  previewView = new PreviewView(this);
                  previewView.setScaleType(PreviewView.ScaleType.FILL_CENTER);
                  root.addView(previewView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  LinearLayout topPanel = new LinearLayout(this);
                  topPanel.setOrientation(LinearLayout.HORIZONTAL);
                  topPanel.setGravity(Gravity.CENTER_VERTICAL);
                  topPanel.setPadding(dp(16), dp(12), dp(16), dp(12));
                  topPanel.setBackgroundColor(PANEL);

                  TextView title = new TextView(this);
                  title.setText("CAMERA PRO");
                  title.setTextColor(WHITE);
                  title.setTextSize(19);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("  AI JAVA DEVS");
                  subtitle.setTextColor(0xFFBDBDBD);
                  subtitle.setTextSize(10);

                  LinearLayout titleBox = new LinearLayout(this);
                  titleBox.setOrientation(LinearLayout.HORIZONTAL);
                  titleBox.setGravity(Gravity.CENTER_VERTICAL);
                  titleBox.addView(title);
                  titleBox.addView(subtitle);

                  topPanel.addView(titleBox, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f
                  ));

                  ImageButton galleryButton = createCircleButton("G");
                  galleryButton.setOnClickListener(v -> openGallery());
                  topPanel.addView(galleryButton);

                  FrameLayout.LayoutParams topParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP
                  );
                  root.addView(topPanel, topParams);

                  LinearLayout rightControls = new LinearLayout(this);
                  rightControls.setOrientation(LinearLayout.VERTICAL);
                  rightControls.setGravity(Gravity.CENTER);
                  rightControls.setPadding(dp(8), dp(8), dp(8), dp(8));
                  rightControls.setBackground(roundDrawable(0x88000000, 0x33FFFFFF, dp(18)));

                  flashButton = createCircleButton("F");
                  flashButton.setOnClickListener(v -> toggleFlash());

                  switchButton = createCircleButton("R");
                  switchButton.setOnClickListener(v -> switchCamera());

                  rightControls.addView(flashButton);
                  addGap(rightControls, 8);
                  rightControls.addView(switchButton);

                  FrameLayout.LayoutParams rightParams = new FrameLayout.LayoutParams(
                          dp(58),
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.RIGHT | Gravity.CENTER_VERTICAL
                  );
                  rightParams.setMargins(0, 0, dp(10), 0);
                  root.addView(rightControls, rightParams);

                  LinearLayout bottomPanel = new LinearLayout(this);
                  bottomPanel.setOrientation(LinearLayout.VERTICAL);
                  bottomPanel.setPadding(dp(16), dp(10), dp(16), dp(14));
                  bottomPanel.setBackgroundColor(PANEL);

                  LinearLayout zoomRow = new LinearLayout(this);
                  zoomRow.setGravity(Gravity.CENTER_VERTICAL);

                  TextView zoomLabel = new TextView(this);
                  zoomLabel.setText("ZOOM");
                  zoomLabel.setTextColor(LIGHT);
                  zoomLabel.setTextSize(11);

                  zoomSeekBar = new SeekBar(this);
                  zoomSeekBar.setMax(100);
                  zoomSeekBar.setProgress(0);
                  zoomSeekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (camera != null && fromUser) {
                              float min = camera.getCameraInfo().getZoomState().getValue().getMinZoomRatio();
                              float max = camera.getCameraInfo().getZoomState().getValue().getMaxZoomRatio();
                              float ratio = min + ((max - min) * progress / 100f);
                              camera.getCameraControl().setZoomRatio(ratio);
                              updateZoomText(ratio);
                          }
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar seekBar) {
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar seekBar) {
                      }
                  });

                  zoomText = new TextView(this);
                  zoomText.setText("1.0x");
                  zoomText.setTextColor(WHITE);
                  zoomText.setTextSize(12);
                  zoomText.setGravity(Gravity.RIGHT);

                  zoomRow.addView(zoomLabel, new LinearLayout.LayoutParams(dp(42), dp(40)));
                  zoomRow.addView(zoomSeekBar, new LinearLayout.LayoutParams(
                          0, dp(40), 1f
                  ));
                  zoomRow.addView(zoomText, new LinearLayout.LayoutParams(dp(48), dp(40)));

                  bottomPanel.addView(zoomRow);

                  LinearLayout actions = new LinearLayout(this);
                  actions.setGravity(Gravity.CENTER_VERTICAL);

                  timerButton = new Button(this);
                  timerButton.setText("TIMER OFF");
                  timerButton.setTextColor(WHITE);
                  timerButton.setTextSize(10);
                  timerButton.setBackground(roundDrawable(0x55333333, 0x55FFFFFF, dp(20)));
                  timerButton.setOnClickListener(v -> cycleTimer());

                  actions.addView(timerButton, new LinearLayout.LayoutParams(
                          dp(105), dp(42)
                  ));

                  FrameLayout shutterFrame = new FrameLayout(this);
                  ImageButton shutter = createShutterButton();
                  shutter.setOnClickListener(v -> capturePhoto());
                  shutterFrame.addView(shutter, new FrameLayout.LayoutParams(
                          dp(76), dp(76), Gravity.CENTER
                  ));

                  LinearLayout.LayoutParams shutterParams = new LinearLayout.LayoutParams(
                          0, dp(86), 1f
                  );
                  actions.addView(shutterFrame, shutterParams);

                  flashText = new TextView(this);
                  flashText.setText("FLASH OFF");
                  flashText.setTextColor(LIGHT);
                  flashText.setTextSize(10);
                  flashText.setGravity(Gravity.CENTER);

                  actions.addView(flashText, new LinearLayout.LayoutParams(
                          dp(105), dp(42)
                  ));

                  bottomPanel.addView(actions);

                  timerText = new TextView(this);
                  timerText.setText("");
                  timerText.setTextColor(WHITE);
                  timerText.setTextSize(42);
                  timerText.setGravity(Gravity.CENTER);
                  timerText.setShadowLayer(12, 0, 0, Color.BLACK);

                  FrameLayout.LayoutParams timerOverlay = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          dp(90),
                          Gravity.CENTER
                  );
                  root.addView(timerText, timerOverlay);

                  FrameLayout.LayoutParams bottomParams = new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                  );
                  root.addView(bottomPanel, bottomParams);

                  previewView.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_UP) {
                          focusAt(event.getX(), event.getY());
                      }
                      return true;
                  });

                  setContentView(root);
              }

              private ImageButton createCircleButton(String text) {
                  ImageButton button = new ImageButton(this);
                  button.setImageDrawable(null);
                  button.setBackground(roundDrawable(0x88333333, 0x66FFFFFF, dp(22)));
                  button.setContentDescription(text);

                  TextView label = new TextView(this);
                  label.setText(text);
                  label.setTextColor(WHITE);
                  label.setTextSize(13);
                  label.setGravity(Gravity.CENTER);

                  FrameLayout holder = new FrameLayout(this);
                  holder.setBackground(roundDrawable(0x88333333, 0x66FFFFFF, dp(22)));
                  holder.addView(label, new FrameLayout.LayoutParams(
                          dp(44), dp(44), Gravity.CENTER
                  ));

                  holder.setOnClickListener(v -> button.performClick());

                  button.setLayoutParams(new LinearLayout.LayoutParams(dp(44), dp(44)));
                  return button;
              }

              private ImageButton createShutterButton() {
                  ImageButton button = new ImageButton(this);
                  button.setBackground(roundDrawable(Color.WHITE, 0xFFFFFFFF, dp(40)));
                  button.setContentDescription("Capture");
                  button.setPadding(dp(6), dp(6), dp(6), dp(6));
                  return button;
              }

              private GradientDrawable roundDrawable(int fill, int stroke, int radius) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(fill);
                  drawable.setCornerRadius(radius);
                  drawable.setStroke(dp(1), stroke);
                  return drawable;
              }

              private void addGap(LinearLayout parent, int dp) {
                  View gap = new View(this);
                  parent.addView(gap, new LinearLayout.LayoutParams(
                          1, dp(dp)
                  ));
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private void startCamera() {
                  ListenableFuture<ProcessCameraProvider> cameraProviderFuture =
                          ProcessCameraProvider.getInstance(this);

                  cameraProviderFuture.addListener(() -> {
                      try {
                          ProcessCameraProvider cameraProvider = cameraProviderFuture.get();

                          Preview preview = new Preview.Builder().build();
                          imageCapture = new ImageCapture.Builder()
                                  .setCaptureMode(ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY)
                                  .build();

                          cameraProvider.unbindAll();

                          camera = cameraProvider.bindToLifecycle(
                                  this,
                                  cameraSelector,
                                  preview,
                                  imageCapture
                          );

                          preview.setSurfaceProvider(previewView.getSurfaceProvider());

                          configureZoom();
                          updateFlashUi();

                      } catch (ExecutionException | InterruptedException e) {
                          Toast.makeText(this, "Camera initialization failed", Toast.LENGTH_LONG).show();
                      }
                  }, ContextCompat.getMainExecutor(this));
              }

              private void configureZoom() {
                  if (camera == null || camera.getCameraInfo().getZoomState().getValue() == null) {
                      return;
                  }

                  float min = camera.getCameraInfo().getZoomState().getValue().getMinZoomRatio();
                  float max = camera.getCameraInfo().getZoomState().getValue().getMaxZoomRatio();

                  float current = camera.getCameraInfo().getZoomState().getValue().getZoomRatio();
                  float progress = (current - min) / (max - min);
                  zoomSeekBar.setProgress((int) (progress * 100f));
                  updateZoomText(current);
              }

              private void updateZoomText(float ratio) {
                  zoomText.setText(String.format(Locale.US, "%.1fx", ratio));
              }

              private void focusAt(float x, float y) {
                  if (camera == null) {
                      return;
                  }

                  MeteringPoint factory = previewView.getMeteringPointFactory().createPoint(x, y);

                  FocusMeteringAction action = new FocusMeteringAction.Builder(
                          factory,
                          FocusMeteringAction.FLAG_AF
                  ).setAutoCancelDuration(3, TimeUnit.SECONDS).build();

                  camera.getCameraControl().startFocusAndMetering(action);
              }

              private void toggleFlash() {
                  if (camera == null || imageCapture == null) {
                      return;
                  }

                  if (!camera.getCameraInfo().hasFlashUnit()) {
                      Toast.makeText(this, "Flash is not available on this camera", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  flashEnabled = !flashEnabled;
                  imageCapture.setFlashMode(
                          flashEnabled
                                  ? ImageCapture.FLASH_MODE_ON
                                  : ImageCapture.FLASH_MODE_OFF
                  );
                  updateFlashUi();
              }

              private void updateFlashUi() {
                  if (frontCamera) {
                      flashEnabled = false;
                      if (imageCapture != null) {
                          imageCapture.setFlashMode(ImageCapture.FLASH_MODE_OFF);
                      }
                  }

                  flashText.setText(flashEnabled ? "FLASH ON" : "FLASH OFF");
                  flashText.setTextColor(flashEnabled ? WHITE : LIGHT);
              }

              private void switchCamera() {
                  frontCamera = !frontCamera;
                  cameraSelector = frontCamera
                          ? CameraSelector.DEFAULT_FRONT_CAMERA
                          : CameraSelector.DEFAULT_BACK_CAMERA;
                  flashEnabled = false;
                  startCamera();
              }

              private void cycleTimer() {
                  if (timerSeconds == 0) {
                      timerSeconds = 3;
                  } else if (timerSeconds == 3) {
                      timerSeconds = 5;
                  } else if (timerSeconds == 5) {
                      timerSeconds = 10;
                  } else {
                      timerSeconds = 0;
                  }

                  timerButton.setText(timerSeconds == 0
                          ? "TIMER OFF"
                          : "TIMER " + timerSeconds + "S");
              }

              private void capturePhoto() {
                  if (imageCapture == null || capturing) {
                      return;
                  }

                  capturing = true;

                  if (timerSeconds > 0) {
                      runCountdown(timerSeconds);
                  } else {
                      takePhotoNow();
                  }
              }

              private void runCountdown(int seconds) {
                  final int[] remaining = {seconds};
                  timerText.setText(String.valueOf(remaining[0]));

                  android.os.Handler handler = new android.os.Handler(getMainLooper());
                  Runnable countdown = new Runnable() {
                      @Override
                      public void run() {
                          remaining[0]--;

                          if (remaining[0] <= 0) {
                              timerText.setText("");
                              takePhotoNow();
                          } else {
                              timerText.setText(String.valueOf(remaining[0]));
                              handler.postDelayed(this, 1000);
                          }
                      }
                  };

                  handler.postDelayed(countdown, 1000);
              }

              private void takePhotoNow() {
                  if (imageCapture == null) {
                      capturing = false;
                      return;
                  }

                  shutterSound.play(MediaActionSound.SHUTTER_CLICK);

                  String timestamp = new SimpleDateFormat(
                          "yyyyMMdd_HHmmss",
                          Locale.US
                  ).format(new Date());

                  ContentResolver resolver = getContentResolver();
                  ContentValues values = new ContentValues();
                  values.put(MediaStore.Images.Media.DISPLAY_NAME, "CameraPro_" + timestamp + ".jpg");
                  values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      values.put(
                              MediaStore.Images.Media.RELATIVE_PATH,
                              Environment.DIRECTORY_PICTURES + "/CameraPro"
                      );
                  }

                  Uri outputUri = resolver.insert(
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          values
                  );

                  if (outputUri == null) {
                      capturing = false;
                      Toast.makeText(this, "Could not create image file", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  ImageCapture.OutputFileOptions outputOptions =
                          new ImageCapture.OutputFileOptions.Builder(
                                  resolver,
                                  outputUri,
                                  values
                          ).build();

                  imageCapture.takePicture(
                          outputOptions,
                          ContextCompat.getMainExecutor(this),
                          new ImageCapture.OnImageSavedCallback() {
                              @Override
                              public void onImageSaved(
                                      @NonNull ImageCapture.OutputFileResults outputFileResults) {
                                  capturing = false;
                                  Toast.makeText(
                                          MainActivity.this,
                                          "Photo saved",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }

                              @Override
                              public void onError(@NonNull ImageCaptureException exception) {
                                  capturing = false;
                                  resolver.delete(outputUri, null, null);
                                  Toast.makeText(
                                          MainActivity.this,
                                          "Capture failed",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                  );
              }

              private void openGallery() {
                  Intent intent = new Intent(
                          Intent.ACTION_VIEW,
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI
                  );
                  intent.setType("image/*");
                  intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  try {
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "Gallery app not found", Toast.LENGTH_SHORT).show();
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == CAMERA_PERMISSION
                          && grantResults.length > 0
                          && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startCamera();
                  } else {
                      Toast.makeText(
                              this,
                              "Camera permission is required",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }

              @Override
              protected void onDestroy() {
                  shutterSound.release();
                  super.onDestroy();
              }
          }
          EOF

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

          ./gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
