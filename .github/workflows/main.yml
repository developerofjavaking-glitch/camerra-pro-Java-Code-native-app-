name: 📸 Camerrapro AI Camera - Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: "Camerrapro AI Camera"
  PACKAGE_NAME: "com.camerrapro.aijavadevs"
  GRADLE_VERSION: "9.6"
  AGP_VERSION: "9.4.0"
  KOTLIN_VERSION: "2.2.10"
  CAMERAX_VERSION: "1.6.2"

jobs:
  build:
    name: 🚀 Build Camera APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------------
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Generate complete Android project
      # ---------------------------------------------------------
      - name: 🏗️ Generate Android Project
        shell: bash
        run: |

          set -e

          echo "=========================================="
          echo "📸 Generating Camerrapro AI Camera"
          echo "=========================================="

          rm -rf app gradle settings.gradle.kts build.gradle.kts \
            gradle.properties local.properties

          mkdir -p app/src/main/java/com/camerrapro/aijavadevs
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          # -----------------------------------------------------
          # settings.gradle.kts
          # -----------------------------------------------------

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CamerraproAI"
          include(":app")
          EOF

          # -----------------------------------------------------
          # Root build.gradle.kts
          # -----------------------------------------------------

          cat > build.gradle.kts <<EOF
          plugins {
              id("com.android.application") version "${AGP_VERSION}" apply false
              id("org.jetbrains.kotlin.android") version "${KOTLIN_VERSION}" apply false
          }
          EOF

          # -----------------------------------------------------
          # gradle.properties
          # -----------------------------------------------------

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          # -----------------------------------------------------
          # App build.gradle.kts
          # -----------------------------------------------------

          cat > app/build.gradle.kts <<EOF
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "${PACKAGE_NAME}"
              compileSdk = 37

              defaultConfig {
                  applicationId = "${PACKAGE_NAME}"
                  minSdk = 23
                  targetSdk = 37
                  versionCode = 1
                  versionName = "1.0.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true

                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }

                  debug {
                      applicationIdSuffix = ".debug"
                      versionNameSuffix = "-debug"
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              packaging {
                  resources {
                      excludes += "/META-INF/{AL2.0,LGPL2.1}"
                  }
              }
          }

          dependencies {

              implementation("androidx.core:core-ktx:1.17.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("com.google.android.material:material:1.13.0")

              implementation("androidx.activity:activity-ktx:1.11.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.9.3")

              implementation("androidx.camera:camera-core:${CAMERAX_VERSION}")
              implementation("androidx.camera:camera-camera2:${CAMERAX_VERSION}")
              implementation("androidx.camera:camera-lifecycle:${CAMERAX_VERSION}")
              implementation("androidx.camera:camera-view:${CAMERAX_VERSION}")

          }
          EOF

          # -----------------------------------------------------
          # ProGuard
          # -----------------------------------------------------

          cat > app/proguard-rules.pro <<'EOF'
          # Camerrapro AI Camera
          -keep class androidx.camera.** { *; }
          -dontwarn androidx.camera.**
          EOF

          # -----------------------------------------------------
          # AndroidManifest.xml
          # -----------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />

              <uses-feature
                  android:name="android.hardware.camera"
                  android:required="true" />

              <uses-feature
                  android:name="android.hardware.camera.autofocus"
                  android:required="false" />

              <application
                  android:allowBackup="true"
                  android:hardwareAccelerated="true"
                  android:icon="@drawable/ic_camera_logo"
                  android:label="@string/app_name"
                  android:roundIcon="@drawable/ic_camera_logo"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.Camerrapro">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          # -----------------------------------------------------
          # strings.xml
          # -----------------------------------------------------

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Camerrapro AI Camera</string>
          </resources>
          EOF

          # -----------------------------------------------------
          # colors.xml
          # -----------------------------------------------------

          cat > app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="camera_surface">#090909</color>
              <color name="camera_accent">#FFFFFF</color>
          </resources>
          EOF

          # -----------------------------------------------------
          # styles.xml
          # -----------------------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.Camerrapro"
                  parent="Theme.Material3.Dark.NoActionBar">

                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">@android:color/black</item>
                  <item name="android:navigationBarColor">@android:color/black</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowNoTitle">true</item>

              </style>

          </resources>
          EOF

          # -----------------------------------------------------
          # Premium camera logo
          # -----------------------------------------------------

          cat > app/src/main/res/drawable/ic_camera_logo.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <vector
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#090909"
                  android:pathData="M0,0h108v108h-108z" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M27,35 L35,25 L73,25 L81,35 L92,35 L92,83 L16,83 L16,35 Z" />

              <path
                  android:fillColor="#090909"
                  android:pathData="M54,38 A16,16 0,1 0,54,70 A16,16 0,1 0,54,38" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M54,43 A11,11 0,1 0,54,65 A11,11 0,1 0,54,43" />

              <path
                  android:fillColor="#090909"
                  android:pathData="M82,42 A4,4 0,1 0,82,50 A4,4 0,1 0,82,42" />

          </vector>
          EOF

          # -----------------------------------------------------
          # MainActivity.kt
          # -----------------------------------------------------

          cat > app/src/main/java/com/camerrapro/aijavadevs/MainActivity.kt <<'EOF'
          package com.camerrapro.aijavadevs

          import android.Manifest
          import android.content.ContentValues
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.media.MediaActionSound
          import android.net.Uri
          import android.os.Bundle
          import android.os.CountDownTimer
          import android.provider.MediaStore
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.camera.core.Camera
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageCapture
          import androidx.camera.core.ImageCaptureException
          import androidx.camera.core.Preview
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.camera.view.PreviewView
          import androidx.core.content.ContextCompat
          import java.text.SimpleDateFormat
          import java.util.*
          import java.util.concurrent.ExecutorService
          import java.util.concurrent.Executors
          import kotlin.math.max
          import kotlin.math.min

          class MainActivity : AppCompatActivity() {

              private lateinit var previewView: PreviewView
              private lateinit var imageCapture: ImageCapture
              private lateinit var camera: Camera
              private lateinit var cameraExecutor: ExecutorService

              private var lensFacing = CameraSelector.LENS_FACING_BACK
              private var flashEnabled = false
              private var timerSeconds = 0
              private var currentZoom = 1f

              private lateinit var flashButton: TextView
              private lateinit var timerButton: TextView
              private lateinit var zoomText: TextView
              private lateinit var focusText: TextView

              private val requestPermission =
                  registerForActivityResult(
                      ActivityResultContracts.RequestPermission()
                  ) { granted ->
                      if (granted) {
                          startCamera()
                      } else {
                          Toast.makeText(
                              this,
                              "Camera permission is required",
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  window.statusBarColor = Color.BLACK
                  window.navigationBarColor = Color.BLACK

                  cameraExecutor = Executors.newSingleThreadExecutor()

                  buildCameraUI()

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {
                      startCamera()
                  } else {
                      requestPermission.launch(Manifest.permission.CAMERA)
                  }
              }

              private fun buildCameraUI() {

                  val root = FrameLayout(this)

                  previewView = PreviewView(this)

                  previewView.scaleType =
                      PreviewView.ScaleType.FILL_CENTER

                  root.addView(
                      previewView,
                      FrameLayout.LayoutParams(
                          -1,
                          -1
                      )
                  )

                  // Top gradient-style dark toolbar
                  val topBar = LinearLayout(this)

                  topBar.orientation = LinearLayout.HORIZONTAL
                  topBar.gravity = Gravity.CENTER_VERTICAL
                  topBar.setPadding(24, 30, 24, 10)
                  topBar.setBackgroundColor(
                      Color.argb(90, 0, 0, 0)
                  )

                  val brand = TextView(this)

                  brand.text = "CAMERRAPRO"
                  brand.textSize = 16f
                  brand.setTextColor(Color.WHITE)
                  brand.setTypeface(null, 1)

                  topBar.addView(
                      brand,
                      LinearLayout.LayoutParams(
                          0,
                          70,
                          1f
                      )
                  )

                  flashButton = createTopButton("⚡")

                  flashButton.setOnClickListener {
                      flashEnabled = !flashEnabled

                      flashButton.text =
                          if (flashEnabled) "⚡ ON" else "⚡"

                      camera.cameraControl.enableTorch(
                          flashEnabled
                      )
                  }

                  topBar.addView(
                      flashButton,
                      LinearLayout.LayoutParams(
                          90,
                          70
                      )
                  )

                  timerButton = createTopButton("⏱")

                  timerButton.setOnClickListener {
                      timerSeconds =
                          when (timerSeconds) {
                              0 -> 3
                              3 -> 5
                              else -> 0
                          }

                      timerButton.text =
                          if (timerSeconds == 0)
                              "⏱"
                          else
                              "⏱ ${timerSeconds}s"
                  }

                  topBar.addView(
                      timerButton,
                      LinearLayout.LayoutParams(
                          100,
                          70
                      )
                  )

                  root.addView(
                      topBar,
                      FrameLayout.LayoutParams(
                          -1,
                          100,
                          Gravity.TOP
                      )
                  )

                  // Center focus indicator
                  focusText = TextView(this)

                  focusText.text = "＋"
                  focusText.textSize = 38f
                  focusText.setTextColor(Color.WHITE)
                  focusText.gravity = Gravity.CENTER

                  root.addView(
                      focusText,
                      FrameLayout.LayoutParams(
                          90,
                          90,
                          Gravity.CENTER
                      )
                  )

                  // Zoom controls
                  val zoomBar = LinearLayout(this)

                  zoomBar.orientation = LinearLayout.HORIZONTAL
                  zoomBar.gravity = Gravity.CENTER

                  zoomText = createZoomButton("1×")

                  zoomText.setOnClickListener {
                      setZoom(
                          if (currentZoom < 3f)
                              min(3f, currentZoom + 0.5f)
                          else
                              1f
                      )
                  }

                  zoomBar.addView(
                      zoomText,
                      LinearLayout.LayoutParams(
                          110,
                          80
                      )
                  )

                  val zoomLayout =
                      FrameLayout.LayoutParams(
                          -1,
                          90,
                          Gravity.BOTTOM
                      )

                  zoomLayout.bottomMargin = 250

                  root.addView(zoomBar, zoomLayout)

                  // Bottom controls
                  val bottom = LinearLayout(this)

                  bottom.orientation = LinearLayout.HORIZONTAL
                  bottom.gravity = Gravity.CENTER_VERTICAL
                  bottom.setPadding(28, 20, 28, 30)
                  bottom.setBackgroundColor(
                      Color.argb(210, 0, 0, 0)
                  )

                  val gallery = createBottomButton("▣")

                  gallery.setOnClickListener {
                      openGallery()
                  }

                  bottom.addView(
                      gallery,
                      LinearLayout.LayoutParams(
                          100,
                          120
                      )
                  )

                  val captureContainer =
                      FrameLayout(this)

                  val captureButton = TextView(this)

                  captureButton.text = "●"
                  captureButton.textSize = 62f
                  captureButton.gravity = Gravity.CENTER
                  captureButton.setTextColor(Color.WHITE)

                  captureButton.setOnClickListener {
                      captureWithTimer()
                  }

                  captureContainer.addView(
                      captureButton,
                      FrameLayout.LayoutParams(
                          150,
                          150,
                          Gravity.CENTER
                      )
                  )

                  bottom.addView(
                      captureContainer,
                      LinearLayout.LayoutParams(
                          0,
                          150,
                          1f
                      )
                  )

                  val switchCamera =
                      createBottomButton("↻")

                  switchCamera.setOnClickListener {
                      lensFacing =
                          if (
                              lensFacing ==
                              CameraSelector.LENS_FACING_BACK
                          )
                              CameraSelector.LENS_FACING_FRONT
                          else
                              CameraSelector.LENS_FACING_BACK

                      startCamera()
                  }

                  bottom.addView(
                      switchCamera,
                      LinearLayout.LayoutParams(
                          100,
                          120
                      )
                  )

                  root.addView(
                      bottom,
                      FrameLayout.LayoutParams(
                          -1,
                          220,
                          Gravity.BOTTOM
                      )
                  )

                  // Tap-to-focus
                  previewView.setOnTouchListener { _, event ->

                      if (
                          event.action ==
                          MotionEvent.ACTION_UP
                      ) {
                          focusText.animate()
                              .scaleX(1.25f)
                              .scaleY(1.25f)
                              .setDuration(100)
                              .withEndAction {
                                  focusText.animate()
                                      .scaleX(1f)
                                      .scaleY(1f)
                                      .setDuration(150)
                                      .start()
                              }
                              .start()

                          try {
                              val factory =
                                  previewView.meteringPointFactory

                              val point =
                                  factory.createPoint(
                                      event.x,
                                      event.y
                                  )

                              val action =
                                  androidx.camera.core.FocusMeteringAction.Builder(
                                      point
                                  ).build()

                              camera.cameraControl.startFocusAndMetering(
                                  action
                              )
                          } catch (_: Exception) {
                          }
                      }

                      true
                  }

                  setContentView(root)
              }

              private fun createTopButton(text: String): TextView {
                  val v = TextView(this)

                  v.text = text
                  v.textSize = 15f
                  v.gravity = Gravity.CENTER
                  v.setTextColor(Color.WHITE)

                  return v
              }

              private fun createBottomButton(text: String): TextView {
                  val v = TextView(this)

                  v.text = text
                  v.textSize = 30f
                  v.gravity = Gravity.CENTER
                  v.setTextColor(Color.WHITE)

                  return v
              }

              private fun createZoomButton(text: String): TextView {
                  val v = TextView(this)

                  v.text = text
                  v.textSize = 16f
                  v.gravity = Gravity.CENTER
                  v.setTextColor(Color.WHITE)
                  v.setBackgroundColor(
                      Color.argb(150, 0, 0, 0)
                  )

                  return v
              }

              private fun startCamera() {

                  val future =
                      ProcessCameraProvider.getInstance(this)

                  future.addListener({

                      val provider =
                          future.get()

                      val selector =
                          CameraSelector.Builder()
                              .requireLensFacing(lensFacing)
                              .build()

                      val preview =
                          Preview.Builder()
                              .build()

                      preview.setSurfaceProvider(
                          previewView.surfaceProvider
                      )

                      imageCapture =
                          ImageCapture.Builder()
                              .setCaptureMode(
                                  ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY
                              )
                              .setFlashMode(
                                  if (flashEnabled)
                                      ImageCapture.FLASH_MODE_ON
                                  else
                                      ImageCapture.FLASH_MODE_OFF
                              )
                              .build()

                      try {

                          provider.unbindAll()

                          camera =
                              provider.bindToLifecycle(
                                  this,
                                  selector,
                                  preview,
                                  imageCapture
                              )

                          camera.cameraControl.setZoomRatio(
                              currentZoom
                          )

                      } catch (e: Exception) {

                          Toast.makeText(
                              this,
                              "Camera initialization failed",
                              Toast.LENGTH_SHORT
                          ).show()
                      }

                  }, ContextCompat.getMainExecutor(this))
              }

              private fun setZoom(value: Float) {

                  currentZoom = max(1f, min(value, 8f))

                  zoomText.text =
                      "${currentZoom.toInt()}×"

                  if (::camera.isInitialized) {
                      camera.cameraControl.setZoomRatio(
                          currentZoom
                      )
                  }
              }

              private fun captureWithTimer() {

                  if (!::imageCapture.isInitialized) {
                      return
                  }

                  if (timerSeconds == 0) {
                      takePhoto()
                      return
                  }

                  val seconds =
                      timerSeconds

                  object : CountDownTimer(
                      seconds * 1000L,
                      1000
                  ) {

                      override fun onTick(
                          millisUntilFinished: Long
                      ) {

                          focusText.text =
                              "${(millisUntilFinished / 1000) + 1}"
                      }

                      override fun onFinish() {

                          focusText.text = "＋"
                          takePhoto()
                      }

                  }.start()
              }

              private fun takePhoto() {

                  val name =
                      SimpleDateFormat(
                          "yyyyMMdd_HHmmss",
                          Locale.US
                      ).format(Date())

                  val values =
                      ContentValues().apply {

                          put(
                              MediaStore.Images.Media.DISPLAY_NAME,
                              "Camerrapro_$name.jpg"
                          )

                          put(
                              MediaStore.Images.Media.MIME_TYPE,
                              "image/jpeg"
                          )

                          if (
                              android.os.Build.VERSION.SDK_INT >=
                              android.os.Build.VERSION_CODES.Q
                          ) {
                              put(
                                  MediaStore.Images.Media.RELATIVE_PATH,
                                  "Pictures/Camerrapro"
                              )
                          }
                      }

                  val output =
                      ImageCapture.OutputFileOptions.Builder(
                          contentResolver,
                          MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                          values
                      ).build()

                  imageCapture.takePicture(
                      output,
                      cameraExecutor,
                      object :
                          ImageCapture.OnImageSavedCallback {

                          override fun onImageSaved(
                              outputFileResults:
                              ImageCapture.OutputFileResults
                          ) {

                              runOnUiThread {

                                  // Native camera shutter sound
                                  try {
                                      val sound =
                                          MediaActionSound()

                                      sound.play(
                                          MediaActionSound.SHUTTER_CLICK
                                      )
                                  } catch (_: Exception) {
                                  }

                                  Toast.makeText(
                                      this@MainActivity,
                                      "📸 Photo saved",
                                      Toast.LENGTH_SHORT
                                  ).show()

                                  focusText.animate()
                                      .alpha(0.2f)
                                      .setDuration(80)
                                      .withEndAction {
                                          focusText.animate()
                                              .alpha(1f)
                                              .setDuration(120)
                                              .start()
                                      }
                                      .start()
                              }
                          }

                          override fun onError(
                              exception:
                              ImageCaptureException
                          ) {

                              runOnUiThread {

                                  Toast.makeText(
                                      this@MainActivity,
                                      "Failed: ${exception.message}",
                                      Toast.LENGTH_SHORT
                                  ).show()
                              }
                          }
                      }
                  )
              }

              private fun openGallery() {

                  try {

                      val intent =
                          android.content.Intent(
                              android.content.Intent.ACTION_VIEW
                          )

                      intent.type = "image/*"
                      intent.flags =
                          android.content.Intent.FLAG_ACTIVITY_NEW_TASK

                      startActivity(intent)

                  } catch (_: Exception) {

                      Toast.makeText(
                          this,
                          "Gallery not available",
                          Toast.LENGTH_SHORT
                      ).show()
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  cameraExecutor.shutdown()
              }
          }
          EOF

          # -----------------------------------------------------
          # Download Gradle
          # -----------------------------------------------------

          echo "📦 Installing Gradle ${GRADLE_VERSION}"

          curl -L \
            -o /tmp/gradle.zip \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"

          mkdir -p /tmp/gradle

          unzip -q \
            /tmp/gradle.zip \
            -d /tmp/gradle

          export PATH="/tmp/gradle/gradle-${GRADLE_VERSION}/bin:$PATH"

          gradle --version

          # -----------------------------------------------------
          # Generate Gradle Wrapper
          # -----------------------------------------------------

          gradle wrapper \
            --gradle-version "${GRADLE_VERSION}" \
            --distribution-type bin

          chmod +x gradlew

          # -----------------------------------------------------
          # Build
          # -----------------------------------------------------

          echo "=========================================="
          echo "🔨 Building Release APK..."
          echo "=========================================="

          ./gradlew \
            --no-daemon \
            --stacktrace \
            assembleRelease

          echo "=========================================="
          echo "✅ BUILD COMPLETE"
          echo "=========================================="

          ls -lh app/build/outputs/apk/release/

      # ---------------------------------------------------------
      # 4. Upload APK artifact
      # ---------------------------------------------------------
      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Camerrapro-AI-Camera
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---------------------------------------------------------
      # 5. Create GitHub Release
      # ---------------------------------------------------------
      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "📸 Camerrapro AI Camera v1.0.${{ github.run_number }}"
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
