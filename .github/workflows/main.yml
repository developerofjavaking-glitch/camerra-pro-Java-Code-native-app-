name: Build Camera Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Camera Pro Project & Build APK
        run: |
          set -e

          mkdir -p app/src/main/java/com/camerrapro/aijavadevs
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CameraPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.camerrapro.aijavadevs'
              compileSdk 34

              defaultConfig {
                  applicationId "com.camerrapro.aijavadevs"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation "androidx.appcompat:appcompat:1.6.1"
              implementation "androidx.camera:camera-core:1.3.4"
              implementation "androidx.camera:camera-camera2:1.3.4"
              implementation "androidx.camera:camera-lifecycle:1.3.4"
              implementation "androidx.camera:camera-view:1.3.4"
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="accent_amber">#FFD54F</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Camera Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_camera_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#121217"
                  android:pathData="M16,24 A8,8 0 0 1 24,16 L84,16 A8,8 0 0 1 92,24 L92,84 A8,8 0 0 1 84,92 L24,92 A8,8 0 0 1 16,84 Z" />
              <path
                  android:strokeColor="#FFC107"
                  android:strokeWidth="3.5"
                  android:pathData="M54,54 m-30,0 a30,30 0 1,0 60,0 a30,30 0 1,0 -60,0" />
              <path
                  android:fillColor="#FFD54F"
                  android:pathData="M54,29 L63,45 L47,51 Z" />
              <path
                  android:fillColor="#FFCA28"
                  android:pathData="M79,54 L63,63 L57,47 Z" />
              <path
                  android:fillColor="#FFB300"
                  android:pathData="M54,79 L45,63 L61,57 Z" />
              <path
                  android:fillColor="#FFA000"
                  android:pathData="M29,54 L45,45 L51,61 Z" />
              <path
                  android:fillColor="#00E5FF"
                  android:pathData="M54,54 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_flash_on.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFD54F"
                  android:pathData="M7,2v11h3v9l7,-12h-4l4,-8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_flash_off.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#88FFFFFF"
                  android:pathData="M3.27,3L2,4.27l5,5V13h3v9l3.58,-6.14L17.73,20 19,18.73 3.27,3zM17,10h-4l4,-8H7v2.18l8.46,8.46L17,10z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_switch_cam.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M20,4h-3.17L15,1.83C14.8,1.33 14.33,1 13.83,1H10.17C9.67,1 9.2,1.33 9,1.83L7.17,4H4c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h16c1.1,0 2,-0.9 2,-2V6c0,-1.1 -0.9,-2 -2,-2zm-8,14c-3.31,0 -6,-2.69 -6,-6h2c0,2.21 1.79,4 4,4 1.48,0 2.77,-0.81 3.46,-2H13v-2h5v5h-2v-1.65c-1.04,1.6 -2.87,2.65 -5,2.65zm4,-8c0,-2.21 -1.79,-4 -4,-4 -1.48,0 -2.77,0.81 -3.46,2H11v2H6V5h2v1.65C9.04,5.05 10.87,4 13,4c3.31,0 6,2.69 6,6h-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_gallery.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="28dp"
              android:height="28dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M21,19V5c0,-1.1 -0.9,-2 -2,-2H5c-1.1,0 -2,0.9 -2,2v14c0,1.1 0.9,2 2,2h14c1.1,0 2,-0.9 2,-2zM8.5,13.5l2.5,3.01L14.5,12l4.5,6H5l3.5,-4.5z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_focus_ring.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="72dp"
              android:height="72dp"
              android:viewportWidth="72"
              android:viewportHeight="72">
              <path
                  android:strokeColor="#FFD54F"
                  android:strokeWidth="2.5"
                  android:pathData="M16,6 L6,6 L6,16 M56,6 L66,6 L66,16 M6,56 L6,66 L16,66 M66,56 L66,66 L56,66" />
              <path
                  android:strokeColor="#FFD54F"
                  android:strokeWidth="1.5"
                  android:pathData="M36,36 m-7,0 a7,7 0 1,0 14,0 a7,7 0 1,0 -14,0" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="28" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_camera_logo"
                  android:roundIcon="@drawable/ic_camera_logo"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/camerrapro/aijavadevs/MainActivity.java
          package com.camerrapro.aijavadevs;

          import android.Manifest;
          import android.animation.Animator;
          import android.animation.AnimatorListenerAdapter;
          import android.content.ContentValues;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.res.ColorStateList;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.graphics.drawable.Drawable;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.media.AudioManager;
          import android.media.MediaActionSound;
          import android.media.ToneGenerator;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Environment;
          import android.os.Handler;
          import android.os.VibrationEffect;
          import android.os.Vibrator;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.FrameLayout;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.SeekBar;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.camera.core.Camera;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.FocusMeteringAction;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.MeteringPoint;
          import androidx.camera.core.MeteringPointFactory;
          import androidx.camera.core.Preview;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.concurrent.TimeUnit;

          public class MainActivity extends AppCompatActivity {

              private static final int CAMERA_PERMISSION_CODE = 101;

              private PreviewView previewView;
              private ImageCapture imageCapture;
              private Camera camera;
              private CameraSelector cameraSelector = CameraSelector.DEFAULT_BACK_CAMERA;

              private boolean isFrontCamera = false;
              private boolean isFlashOn = false;
              private int timerSeconds = 0;
              private boolean isCapturing = false;

              private ImageView flashIcon;
              private TextView timerBadge;
              private TextView zoomValueText;
              private SeekBar zoomSeekBar;
              private TextView countdownOverlay;
              private ImageView focusIndicator;
              private View shutterFlashOverlay;

              private final MediaActionSound cameraSound = new MediaActionSound();
              private ToneGenerator toneGen;
              private Vibrator vibrator;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  cameraSound.load(MediaActionSound.SHUTTER_CLICK);
                  cameraSound.load(MediaActionSound.FOCUS_COMPLETE);

                  try {
                      toneGen = new ToneGenerator(AudioManager.STREAM_NOTIFICATION, 80);
                  } catch (Exception ignored) {}

                  vibrator = (Vibrator) getSystemService(Context.VIBRATOR_SERVICE);

                  buildPremiumUi();

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA)
                          == PackageManager.PERMISSION_GRANTED) {
                      startCamera();
                  } else {
                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION_CODE
                      );
                  }
              }

              private void buildPremiumUi() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  previewView = new PreviewView(this);
                  previewView.setScaleType(PreviewView.ScaleType.FILL_CENTER);
                  root.addView(previewView, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  focusIndicator = new ImageView(this);
                  focusIndicator.setImageResource(R.drawable.ic_focus_ring);
                  focusIndicator.setVisibility(View.GONE);
                  root.addView(focusIndicator, new FrameLayout.LayoutParams(dp(72), dp(72)));

                  shutterFlashOverlay = new View(this);
                  shutterFlashOverlay.setBackgroundColor(Color.WHITE);
                  shutterFlashOverlay.setAlpha(0f);
                  root.addView(shutterFlashOverlay, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.MATCH_PARENT
                  ));

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setPadding(dp(20), dp(38), dp(20), dp(16));
                  topBar.setBackground(createGradient(
                          Color.parseColor("#D9000000"),
                          Color.TRANSPARENT
                  ));

                  TextView brand = new TextView(this);
                  brand.setText("CAMERA PRO");
                  brand.setTextColor(Color.WHITE);
                  brand.setTextSize(15);
                  brand.setTypeface(null, Typeface.BOLD);
                  brand.setLetterSpacing(0.14f);
                  topBar.addView(brand, new LinearLayout.LayoutParams(
                          0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f));

                  flashIcon = new ImageView(this);
                  flashIcon.setImageResource(R.drawable.ic_flash_off);
                  flashIcon.setPadding(dp(11), dp(11), dp(11), dp(11));
                  flashIcon.setBackground(makeGlassButton());
                  flashIcon.setOnClickListener(v -> toggleFlash());
                  topBar.addView(flashIcon, new LinearLayout.LayoutParams(dp(46), dp(46)));

                  timerBadge = new TextView(this);
                  timerBadge.setText("OFF");
                  timerBadge.setTextColor(Color.WHITE);
                  timerBadge.setTextSize(12);
                  timerBadge.setTypeface(null, Typeface.BOLD);
                  timerBadge.setGravity(Gravity.CENTER);
                  timerBadge.setBackground(makeGlassButton());

                  LinearLayout.LayoutParams timerParams =
                          new LinearLayout.LayoutParams(dp(54), dp(36));
                  timerParams.setMargins(dp(12), 0, 0, 0);
                  topBar.addView(timerBadge, timerParams);
                  timerBadge.setOnClickListener(v -> cycleTimer());

                  root.addView(topBar, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.TOP
                  ));

                  countdownOverlay = new TextView(this);
                  countdownOverlay.setTextColor(Color.WHITE);
                  countdownOverlay.setTextSize(86);
                  countdownOverlay.setTypeface(null, Typeface.BOLD);
                  countdownOverlay.setGravity(Gravity.CENTER);
                  countdownOverlay.setShadowLayer(28, 0, 0, Color.BLACK);
                  root.addView(countdownOverlay, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.CENTER
                  ));

                  LinearLayout bottomPanel = new LinearLayout(this);
                  bottomPanel.setOrientation(LinearLayout.VERTICAL);
                  bottomPanel.setPadding(dp(22), dp(20), dp(22), dp(30));
                  bottomPanel.setBackground(createBottomPanel());
                  bottomPanel.setElevation(dp(10));

                  LinearLayout zoomRow = new LinearLayout(this);
                  zoomRow.setGravity(Gravity.CENTER_VERTICAL);

                  zoomValueText = new TextView(this);
                  zoomValueText.setText("1.0x");
                  zoomValueText.setTextColor(Color.parseColor("#FFD54F"));
                  zoomValueText.setTextSize(13);
                  zoomValueText.setTypeface(null, Typeface.BOLD);
                  zoomValueText.setGravity(Gravity.CENTER);
                  zoomValueText.setBackground(createPill(
                          Color.parseColor("#22FFD54F"), dp(16)));
                  zoomRow.addView(zoomValueText, new LinearLayout.LayoutParams(dp(56), dp(36)));

                  zoomSeekBar = new SeekBar(this);
                  zoomSeekBar.setMax(100);
                  zoomSeekBar.setProgress(0);

                  ColorStateList accent =
                          ColorStateList.valueOf(Color.parseColor("#FFD54F"));
                  zoomSeekBar.setProgressTintList(accent);
                  zoomSeekBar.setThumbTintList(accent);

                  zoomSeekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (camera == null || !fromUser) return;

                          if (camera.getCameraInfo().getZoomState().getValue() == null) return;

                          float min = camera.getCameraInfo().getZoomState()
                                  .getValue().getMinZoomRatio();
                          float max = camera.getCameraInfo().getZoomState()
                                  .getValue().getMaxZoomRatio();

                          float ratio = min + ((max - min) * progress / 100f);
                          camera.getCameraControl().setZoomRatio(ratio);
                          zoomValueText.setText(String.format(Locale.US, "%.1fx", ratio));
                      }

                      @Override public void onStartTrackingTouch(SeekBar seekBar) {}
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {}
                  });

                  LinearLayout.LayoutParams zoomParams =
                          new LinearLayout.LayoutParams(0, dp(38), 1f);
                  zoomParams.setMargins(dp(14), 0, 0, 0);
                  zoomRow.addView(zoomSeekBar, zoomParams);
                  bottomPanel.addView(zoomRow);

                  LinearLayout actions = new LinearLayout(this);
                  actions.setGravity(Gravity.CENTER_VERTICAL);
                  actions.setPadding(0, dp(18), 0, 0);

                  ImageView galleryBtn = new ImageView(this);
                  galleryBtn.setImageResource(R.drawable.ic_gallery);
                  galleryBtn.setPadding(dp(14), dp(14), dp(14), dp(14));
                  galleryBtn.setBackground(makeGlassButton());
                  galleryBtn.setOnClickListener(v -> openGallery());
                  actions.addView(galleryBtn, new LinearLayout.LayoutParams(dp(54), dp(54)));

                  FrameLayout shutter = new FrameLayout(this);

                  View outerRing = new View(this);
                  outerRing.setBackground(createRing(Color.WHITE, dp(4), dp(44)));
                  shutter.addView(outerRing, new FrameLayout.LayoutParams(
                          dp(88), dp(88), Gravity.CENTER));

                  View innerShutter = new View(this);
                  innerShutter.setBackground(createPill(Color.WHITE, dp(36)));
                  shutter.addView(innerShutter, new FrameLayout.LayoutParams(
                          dp(68), dp(68), Gravity.CENTER));

                  shutter.setOnClickListener(v -> {
                      triggerHaptic();
                      shutter.animate()
                              .scaleX(0.86f)
                              .scaleY(0.86f)
                              .setDuration(70)
                              .withEndAction(() -> shutter.animate()
                                      .scaleX(1f)
                                      .scaleY(1f)
                                      .setDuration(100)
                                      .start());
                      capturePhoto();
                  });

                  LinearLayout.LayoutParams shutterParams =
                          new LinearLayout.LayoutParams(0, dp(98), 1f);
                  actions.addView(shutter, shutterParams);

                  ImageView flipBtn = new ImageView(this);
                  flipBtn.setImageResource(R.drawable.ic_switch_cam);
                  flipBtn.setPadding(dp(14), dp(14), dp(14), dp(14));
                  flipBtn.setBackground(makeGlassButton());
                  flipBtn.setOnClickListener(v -> {
                      triggerHaptic();
                      flipBtn.animate().rotationBy(180).setDuration(250).start();
                      switchCamera();
                  });
                  actions.addView(flipBtn, new LinearLayout.LayoutParams(dp(54), dp(54)));

                  bottomPanel.addView(actions);

                  root.addView(bottomPanel, new FrameLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT,
                          ViewGroup.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                  ));

                  previewView.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_UP) {
                          focusAt(event.getX(), event.getY());
                      }
                      return true;
                  });

                  setContentView(root);
              }

              private void startCamera() {
                  ListenableFuture<ProcessCameraProvider> future =
                          ProcessCameraProvider.getInstance(this);

                  future.addListener(() -> {
                      try {
                          ProcessCameraProvider provider = future.get();

                          Preview preview = new Preview.Builder().build();

                          imageCapture = new ImageCapture.Builder()
                                  .setCaptureMode(ImageCapture.CAPTURE_MODE_MAXIMIZE_QUALITY)
                                  .build();

                          provider.unbindAll();

                          camera = provider.bindToLifecycle(
                                  this,
                                  cameraSelector,
                                  preview,
                                  imageCapture
                          );

                          preview.setSurfaceProvider(previewView.getSurfaceProvider());

                          if (camera.getCameraInfo().getZoomState().getValue() != null) {
                              float zoom = camera.getCameraInfo().getZoomState()
                                      .getValue().getZoomRatio();
                              zoomValueText.setText(String.format(Locale.US, "%.1fx", zoom));
                              zoomSeekBar.setProgress(0);
                          }

                      } catch (Exception e) {
                          Toast.makeText(this,
                                  "Camera initialization failed",
                                  Toast.LENGTH_SHORT).show();
                      }
                  }, ContextCompat.getMainExecutor(this));
              }

              private void focusAt(float x, float y) {
                  if (camera == null) return;

                  MeteringPointFactory factory = previewView.getMeteringPointFactory();
                  MeteringPoint point = factory.createPoint(x, y);

                  FocusMeteringAction action =
                          new FocusMeteringAction.Builder(point, FocusMeteringAction.FLAG_AF)
                                  .setAutoCancelDuration(3, TimeUnit.SECONDS)
                                  .build();

                  camera.getCameraControl().startFocusAndMetering(action);

                  cameraSound.play(MediaActionSound.FOCUS_COMPLETE);
                  triggerHaptic();

                  focusIndicator.setX(x - focusIndicator.getWidth() / 2f);
                  focusIndicator.setY(y - focusIndicator.getHeight() / 2f);
                  focusIndicator.setVisibility(View.VISIBLE);
                  focusIndicator.setAlpha(1f);
                  focusIndicator.setScaleX(1.35f);
                  focusIndicator.setScaleY(1.35f);

                  focusIndicator.animate()
                          .scaleX(1f)
                          .scaleY(1f)
                          .setDuration(180)
                          .withEndAction(() -> focusIndicator.animate()
                                  .alpha(0f)
                                  .setStartDelay(650)
                                  .setDuration(260)
                                  .setListener(new AnimatorListenerAdapter() {
                                      @Override
                                      public void onAnimationEnd(Animator animation) {
                                          focusIndicator.setVisibility(View.GONE);
                                      }
                                  }));
              }

              private void toggleFlash() {
                  if (camera == null || imageCapture == null) return;

                  if (!camera.getCameraInfo().hasFlashUnit()) {
                      Toast.makeText(this, "Flash not available", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  isFlashOn = !isFlashOn;
                  imageCapture.setFlashMode(isFlashOn
                          ? ImageCapture.FLASH_MODE_ON
                          : ImageCapture.FLASH_MODE_OFF);

                  flashIcon.setImageResource(isFlashOn
                          ? R.drawable.ic_flash_on
                          : R.drawable.ic_flash_off);
              }

              private void switchCamera() {
                  isFrontCamera = !isFrontCamera;
                  cameraSelector = isFrontCamera
                          ? CameraSelector.DEFAULT_FRONT_CAMERA
                          : CameraSelector.DEFAULT_BACK_CAMERA;

                  isFlashOn = false;
                  flashIcon.setImageResource(R.drawable.ic_flash_off);
                  startCamera();
              }

              private void cycleTimer() {
                  if (timerSeconds == 0) timerSeconds = 3;
                  else if (timerSeconds == 3) timerSeconds = 5;
                  else if (timerSeconds == 5) timerSeconds = 10;
                  else timerSeconds = 0;

                  timerBadge.setText(timerSeconds == 0 ? "OFF" : timerSeconds + "s");
                  timerBadge.setTextColor(timerSeconds == 0
                          ? Color.WHITE
                          : Color.parseColor("#FFD54F"));
              }

              private void capturePhoto() {
                  if (imageCapture == null || isCapturing) return;

                  isCapturing = true;

                  if (timerSeconds > 0) {
                      runCountdown(timerSeconds);
                  } else {
                      executeCapture();
                  }
              }

              private void runCountdown(int seconds) {
                  final int[] remaining = {seconds};

                  countdownOverlay.setText(String.valueOf(remaining[0]));

                  if (toneGen != null) {
                      toneGen.startTone(ToneGenerator.TONE_PROP_BEEP, 120);
                  }

                  Handler handler = new Handler(getMainLooper());

                  Runnable runnable = new Runnable() {
                      @Override
                      public void run() {
                          remaining[0]--;

                          if (remaining[0] > 0) {
                              countdownOverlay.setText(String.valueOf(remaining[0]));

                              if (toneGen != null) {
                                  toneGen.startTone(ToneGenerator.TONE_PROP_BEEP, 120);
                              }

                              handler.postDelayed(this, 1000);
                          } else {
                              countdownOverlay.setText("");
                              executeCapture();
                          }
                      }
                  };

                  handler.postDelayed(runnable, 1000);
              }

              private void executeCapture() {
                  cameraSound.play(MediaActionSound.SHUTTER_CLICK);

                  shutterFlashOverlay.setAlpha(0.75f);
                  shutterFlashOverlay.animate().alpha(0f).setDuration(150).start();

                  String timestamp = new SimpleDateFormat(
                          "yyyyMMdd_HHmmss", Locale.US).format(new Date());

                  ContentValues values = new ContentValues();
                  values.put(MediaStore.Images.Media.DISPLAY_NAME,
                          "CAMERAPRO_" + timestamp + ".jpg");
                  values.put(MediaStore.Images.Media.MIME_TYPE, "image/jpeg");

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      values.put(MediaStore.Images.Media.RELATIVE_PATH,
                              Environment.DIRECTORY_PICTURES + "/CameraPro");
                      values.put(MediaStore.Images.Media.IS_PENDING, 1);
                  }

                  ImageCapture.OutputFileOptions options =
                          new ImageCapture.OutputFileOptions.Builder(
                                  getContentResolver(),
                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                  values
                          ).build();

                  imageCapture.takePicture(
                          options,
                          ContextCompat.getMainExecutor(this),
                          new ImageCapture.OnImageSavedCallback() {
                              @Override
                              public void onImageSaved(
                                      @NonNull ImageCapture.OutputFileResults results) {

                                  isCapturing = false;
                                  Uri savedUri = results.getSavedUri();

                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q
                                          && savedUri != null) {

                                      ContentValues update = new ContentValues();
                                      update.put(MediaStore.Images.Media.IS_PENDING, 0);
                                      getContentResolver().update(savedUri, update, null, null);
                                  }

                                  Toast.makeText(MainActivity.this,
                                          "Photo saved to Gallery",
                                          Toast.LENGTH_SHORT).show();
                              }

                              @Override
                              public void onError(
                                      @NonNull ImageCaptureException exception) {

                                  isCapturing = false;

                                  Toast.makeText(MainActivity.this,
                                          "Save failed: " + exception.getMessage(),
                                          Toast.LENGTH_LONG).show();
                              }
                          });
              }

              private void openGallery() {
                  try {
                      Intent intent = new Intent(Intent.ACTION_VIEW);
                      intent.setDataAndType(
                              MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                              "image/*");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception e) {
                      Toast.makeText(this, "No gallery app found", Toast.LENGTH_SHORT).show();
                  }
              }

              private void triggerHaptic() {
                  if (vibrator == null) return;

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      vibrator.vibrate(VibrationEffect.createOneShot(
                              35, VibrationEffect.DEFAULT_AMPLITUDE));
                  } else {
                      vibrator.vibrate(35);
                  }
              }

              private int dp(int value) {
                  return (int) (value * getResources().getDisplayMetrics().density + 0.5f);
              }

              private Drawable makeGlassButton() {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#26FFFFFF"));
                  bg.setCornerRadius(dp(20));
                  bg.setStroke(dp(1), Color.parseColor("#33FFFFFF"));

                  RippleDrawable ripple = new RippleDrawable(
                          ColorStateList.valueOf(Color.parseColor("#55FFD54F")),
                          bg,
                          bg
                  );

                  return ripple;
              }

              private GradientDrawable createPill(int color, int radiusDp) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(color);
                  drawable.setCornerRadius(dp(radiusDp));
                  return drawable;
              }

              private GradientDrawable createRing(int color, int strokeDp, int radiusDp) {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(Color.TRANSPARENT);
                  drawable.setStroke(dp(strokeDp), color);
                  drawable.setCornerRadius(dp(radiusDp));
                  return drawable;
              }

              private GradientDrawable createGradient(int startColor, int endColor) {
                  return new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{startColor, endColor});
              }

              private GradientDrawable createBottomPanel() {
                  GradientDrawable drawable = new GradientDrawable(
                          GradientDrawable.Orientation.TOP_BOTTOM,
                          new int[]{
                                  Color.parseColor("#00000000"),
                                  Color.parseColor("#F7050508")
                          });

                  float radius = dp(30);
                  drawable.setCornerRadii(new float[]{
                          radius, radius,
                          radius, radius,
                          0, 0,
                          0, 0
                  });

                  return drawable;
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults) {

                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);

                  if (requestCode == CAMERA_PERMISSION_CODE
                          && grantResults.length > 0
                          && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startCamera();
                  } else {
                      Toast.makeText(this,
                              "Camera permission is required",
                              Toast.LENGTH_LONG).show();
                  }
              }

              @Override
              protected void onDestroy() {
                  cameraSound.release();

                  if (toneGen != null) {
                      toneGen.release();
                  }

                  super.onDestroy();
              }
          }
