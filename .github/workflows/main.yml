name: Build Camera Pro APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Camera Pro Project & Build APK
        run: |
          set -e

          mkdir -p app/src/main/java/com/camerrapro/aijavadevs
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "CameraPro"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.camerrapro.aijavadevs'
              compileSdk 34

              defaultConfig {
                  applicationId "com.camerrapro.aijavadevs"
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'androidx.activity:activity:1.9.3'
              implementation 'androidx.core:core:1.15.0'

              implementation 'androidx.camera:camera-core:1.3.4'
              implementation 'androidx.camera:camera-camera2:1.3.4'
              implementation 'androidx.camera:camera-lifecycle:1.3.4'
              implementation 'androidx.camera:camera-view:1.3.4'
          }
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_camera_logo.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="#10131A"
                  android:pathData="M22,18 L38,18 L45,10 L63,10 L70,18 L86,18 C92,18 96,22 96,28 L96,82 C96,88 92,92 86,92 L22,92 C16,92 12,88 12,82 L12,28 C12,22 16,18 22,18 Z" />

              <path
                  android:fillColor="#1D2430"
                  android:pathData="M22,25 L86,25 C89,25 91,27 91,30 L91,80 C91,83 89,85 86,85 L22,85 C19,85 17,83 17,80 L17,30 C17,27 19,25 22,25 Z" />

              <path
                  android:fillColor="#00D9FF"
                  android:pathData="M54,31 A22,22 0,1 0,54 75 A22,22 0,1 0,54 31" />

              <path
                  android:fillColor="#10131A"
                  android:pathData="M54,37 A16,16 0,1 0,54 69 A16,16 0,1 0,54 37" />

              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M78,29 A5,5 0,1 0,78 39 A5,5 0,1 0,78 29" />
          </vector>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_camera_logo"
                  android:roundIcon="@drawable/ic_camera_logo"
                  android:label="Camera Pro"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          mkdir -p app/src/main/res/values

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="camera_bg">#080A0F</color>
              <color name="camera_panel">#151922</color>
              <color name="camera_accent">#00D9FF</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>

              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#00D9FF</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#080A0F</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowNoTitle">true</item>
              </style>

          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Camera Pro</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/camerrapro/aijavadevs/MainActivity.java
          package com.camerrapro.aijavadevs;

          import android.Manifest;
          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.ImageButton;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.annotation.NonNull;
          import androidx.camera.core.Camera;
          import androidx.camera.core.CameraSelector;
          import androidx.camera.core.ImageCapture;
          import androidx.camera.core.ImageCaptureException;
          import androidx.camera.core.Preview;
          import androidx.camera.lifecycle.ProcessCameraProvider;
          import androidx.camera.view.PreviewView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          import com.google.common.util.concurrent.ListenableFuture;

          import java.text.SimpleDateFormat;
          import java.util.Date;
          import java.util.Locale;
          import java.util.concurrent.ExecutionException;

          public class MainActivity extends Activity {

              private static final int CAMERA_PERMISSION = 1001;

              private PreviewView previewView;
              private ImageCapture imageCapture;
              private Camera camera;
              private CameraSelector cameraSelector;
              private boolean frontCamera = false;
              private int timerSeconds = 0;

              private TextView zoomText;
              private TextView timerText;
              private ImageButton flashButton;
              private Button timerButton;

              private final Handler handler = new Handler(Looper.getMainLooper());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  getWindow().setStatusBarColor(Color.BLACK);
                  getWindow().setNavigationBarColor(Color.BLACK);

                  buildCameraUI();

                  if (ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                  ) != PackageManager.PERMISSION_GRANTED) {

                      ActivityCompat.requestPermissions(
                              this,
                              new String[]{Manifest.permission.CAMERA},
                              CAMERA_PERMISSION
                      );

                  } else {
                      startCamera();
                  }
              }

              private void buildCameraUI() {
                  FrameLayout root = new FrameLayout(this);
                  root.setBackgroundColor(Color.BLACK);

                  previewView = new PreviewView(this);
                  previewView.setScaleType(PreviewView.ScaleType.FILL_CENTER);

                  root.addView(
                          previewView,
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                          )
                  );

                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  topBar.setPadding(dp(18), dp(12), dp(18), dp(12));

                  TextView title = new TextView(this);
                  title.setText("CAMERA PRO");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(20);
                  title.setTypeface(null, 1);

                  topBar.addView(
                          title,
                          new LinearLayout.LayoutParams(
                                  0,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  1
                          )
                  );

                  zoomText = new TextView(this);
                  zoomText.setText("1.0x");
                  zoomText.setTextColor(Color.WHITE);
                  zoomText.setTextSize(15);
                  zoomText.setGravity(Gravity.CENTER);

                  topBar.addView(zoomText);

                  FrameLayout.LayoutParams topParams =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  Gravity.TOP
                          );

                  root.addView(topBar, topParams);

                  LinearLayout rightControls = new LinearLayout(this);
                  rightControls.setOrientation(LinearLayout.VERTICAL);
                  rightControls.setGravity(Gravity.CENTER);

                  flashButton = createControlButton("FLASH");
                  flashButton.setOnClickListener(v -> toggleFlash());

                  ImageButton switchButton = createControlButton("FLIP");
                  switchButton.setOnClickListener(v -> switchCamera());

                  rightControls.addView(flashButton);
                  addSpace(rightControls, 10);
                  rightControls.addView(switchButton);

                  FrameLayout.LayoutParams rightParams =
                          new FrameLayout.LayoutParams(
                                  dp(82),
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  Gravity.END | Gravity.CENTER_VERTICAL
                          );

                  rightParams.setMargins(0, 0, dp(12), 0);

                  root.addView(rightControls, rightParams);

                  LinearLayout bottomBar = new LinearLayout(this);
                  bottomBar.setOrientation(LinearLayout.HORIZONTAL);
                  bottomBar.setGravity(Gravity.CENTER_VERTICAL);
                  bottomBar.setPadding(dp(18), dp(16), dp(18), dp(24));

                  Button galleryButton = createBottomButton("GALLERY");
                  galleryButton.setOnClickListener(v -> openGallery());

                  timerButton = createBottomButton("TIMER OFF");
                  timerButton.setOnClickListener(v -> cycleTimer());

                  Button shutterButton = new Button(this);
                  shutterButton.setText("");
                  shutterButton.setBackground(createShutterDrawable());
                  shutterButton.setOnClickListener(v -> takePhoto());

                  LinearLayout.LayoutParams shutterParams =
                          new LinearLayout.LayoutParams(dp(76), dp(76));

                  shutterParams.setMargins(dp(22), 0, dp(22), 0);

                  bottomBar.addView(
                          galleryButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(50),
                                  1
                          )
                  );

                  bottomBar.addView(shutterButton, shutterParams);

                  bottomBar.addView(
                          timerButton,
                          new LinearLayout.LayoutParams(
                                  0,
                                  dp(50),
                                  1
                          )
                  );

                  FrameLayout.LayoutParams bottomParams =
                          new FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.WRAP_CONTENT,
                                  Gravity.BOTTOM
                          );

                  root.addView(bottomBar, bottomParams);

                  setContentView(root);

                  previewView.setOnTouchListener(new View.OnTouchListener() {
                      float startDistance = 0;

                      @Override
                      public boolean onTouch(View v, MotionEvent event) {
                          if (event.getPointerCount() == 2) {
                              if (event.getActionMasked() == MotionEvent.ACTION_POINTER_DOWN) {
                                  startDistance = distance(event);
                              }

                              if (event.getActionMasked() == MotionEvent.ACTION_MOVE) {
                                  float currentDistance = distance(event);

                                  if (startDistance > 0) {
                                      float scale = currentDistance / startDistance;
                                      applyZoom(scale);
                                      startDistance = currentDistance;
                                  }
                              }

                              return true;
                          }

                          if (event.getAction() == MotionEvent.ACTION_UP) {
                              focusAt(event.getX(), event.getY());
                          }

                          return true;
                      }
                  });
              }

              private ImageButton createControlButton(String text) {
                  ImageButton button = new ImageButton(this);
                  button.setContentDescription(text);
                  button.setImageDrawable(null);
                  button.setBackground(createControlDrawable());
                  button.setPadding(dp(10), dp(10), dp(10), dp(10));

                  TextView overlay = new TextView(this);
                  overlay.setText(text);
                  overlay.setTextColor(Color.WHITE);
                  overlay.setTextSize(9);

                  button.setTag(text);

                  return button;
              }

              private Button createBottomButton(String text) {
                  Button button = new Button(this);
                  button.setText(text);
                  button.setTextSize(10);
                  button.setTextColor(Color.WHITE);
                  button.setAllCaps(false);
                  button.setBackground(createControlDrawable());
                  return button;
              }

              private GradientDrawable createControlDrawable() {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setColor(0x88000000);
                  drawable.setCornerRadius(dp(18));
                  drawable.setStroke(dp(1), 0x66FFFFFF);
                  return drawable;
              }

              private GradientDrawable createShutterDrawable() {
                  GradientDrawable drawable = new GradientDrawable();
                  drawable.setShape(GradientDrawable.OVAL);
                  drawable.setColor(Color.WHITE);
                  drawable.setStroke(dp(5), 0xFF00D9FF);
                  return drawable;
              }

              private void startCamera() {
                  ListenableFuture<ProcessCameraProvider> cameraProviderFuture =
                          ProcessCameraProvider.getInstance(this);

                  cameraProviderFuture.addListener(() -> {
                      try {
                          ProcessCameraProvider cameraProvider =
                                  cameraProviderFuture.get();

                          Preview preview = new Preview.Builder().build();

                          imageCapture = new ImageCapture.Builder()
                                  .setCaptureMode(
                                          ImageCapture.CAPTURE_MODE_MINIMIZE_LATENCY
                                  )
                                  .setJpegQuality(95)
                                  .build();

                          cameraSelector = frontCamera
                                  ? CameraSelector.DEFAULT_FRONT_CAMERA
                                  : CameraSelector.DEFAULT_BACK_CAMERA;

                          cameraProvider.unbindAll();

                          camera = cameraProvider.bindToLifecycle(
                                  this,
                                  cameraSelector,
                                  preview,
                                  imageCapture
                          );

                          preview.setSurfaceProvider(
                                  previewView.getSurfaceProvider()
                          );

                          updateZoomText();

                      } catch (ExecutionException | InterruptedException e) {
                          Toast.makeText(
                                  this,
                                  "Camera initialization failed",
                                  Toast.LENGTH_SHORT
                          ).show();
                      }

                  }, ContextCompat.getMainExecutor(this));
              }

              private void takePhoto() {
                  if (imageCapture == null) {
                      return;
                  }

                  if (timerSeconds > 0) {
                      final int delay = timerSeconds;

                      timerText = new TextView(this);
                      timerText.setText(String.valueOf(delay));
                      timerText.setTextColor(Color.WHITE);
                      timerText.setTextSize(56);
                      timerText.setGravity(Gravity.CENTER);
                      timerText.setTypeface(null, 1);

                      addContentView(
                              timerText,
                              new ViewGroup.LayoutParams(
                                      ViewGroup.LayoutParams.MATCH_PARENT,
                                      ViewGroup.LayoutParams.MATCH_PARENT
                              )
                      );

                      final int[] remaining = {delay};

                      Runnable countdown = new Runnable() {
                          @Override
                          public void run() {
                              if (remaining[0] > 0) {
                                  timerText.setText(
                                          String.valueOf(remaining[0])
                                  );

                                  remaining[0]--;

                                  handler.postDelayed(this, 1000);
                              } else {
                                  if (timerText != null) {
                                      ((ViewGroup) timerText.getParent())
                                              .removeView(timerText);
                                      timerText = null;
                                  }

                                  captureImage();
                              }
                          }
                      };

                      handler.post(countdown);

                  } else {
                      captureImage();
                  }
              }

              private void captureImage() {
                  String name = new SimpleDateFormat(
                          "yyyyMMdd_HHmmss",
                          Locale.US
                  ).format(new Date());

                  ContentValues values = new ContentValues();
                  values.put(
                          MediaStore.Images.Media.DISPLAY_NAME,
                          "CameraPro_" + name + ".jpg"
                  );
                  values.put(
                          MediaStore.Images.Media.MIME_TYPE,
                          "image/jpeg"
                  );

                  ImageCapture.OutputFileOptions outputOptions =
                          new ImageCapture.OutputFileOptions.Builder(
                                  getContentResolver(),
                                  MediaStore.Images.Media.EXTERNAL_CONTENT_URI,
                                  values
                          ).build();

                  imageCapture.takePicture(
                          outputOptions,
                          ContextCompat.getMainExecutor(this),
                          new ImageCapture.OnImageSavedCallback() {

                              @Override
                              public void onImageSaved(
                                      @NonNull ImageCapture.OutputFileResults output
                              ) {
                                  Toast.makeText(
                                          MainActivity.this,
                                          "Photo saved",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }

                              @Override
                              public void onError(
                                      @NonNull ImageCaptureException exception
                              ) {
                                  Toast.makeText(
                                          MainActivity.this,
                                          "Photo capture failed",
                                          Toast.LENGTH_SHORT
                                  ).show();
                              }
                          }
                  );
              }

              private void switchCamera() {
                  frontCamera = !frontCamera;
                  startCamera();
              }

              private void toggleFlash() {
                  if (camera == null) {
                      return;
                  }

                  if (camera.getCameraInfo().hasFlashUnit()) {
                      boolean enabled =
                              camera.getCameraInfo()
                                      .getTorchState()
                                      .getValue() != 1;

                      camera.getCameraControl().enableTorch(enabled);

                      Toast.makeText(
                              this,
                              enabled ? "Flash ON" : "Flash OFF",
                              Toast.LENGTH_SHORT
                      ).show();
                  } else {
                      Toast.makeText(
                              this,
                              "Flash not available",
                              Toast.LENGTH_SHORT
                      ).show();
                  }
              }

              private void cycleTimer() {
                  if (timerSeconds == 0) {
                      timerSeconds = 3;
                  } else if (timerSeconds == 3) {
                      timerSeconds = 5;
                  } else if (timerSeconds == 5) {
                      timerSeconds = 10;
                  } else {
                      timerSeconds = 0;
                  }

                  timerButton.setText(
                          timerSeconds == 0
                                  ? "TIMER OFF"
                                  : "TIMER " + timerSeconds + "S"
                  );
              }

              private void focusAt(float x, float y) {
                  if (camera == null) {
                      return;
                  }

                  try {
                      androidx.camera.core.MeteringPoint point =
                              previewView.getMeteringPointFactory()
                                      .createPoint(x, y);

                      androidx.camera.core.FocusMeteringAction action =
                              new androidx.camera.core.FocusMeteringAction.Builder(
                                      point,
                                      androidx.camera.core.FocusMeteringAction.FLAG_AF
                              ).setAutoCancelDuration(
                                      3,
                                      java.util.concurrent.TimeUnit.SECONDS
                              ).build();

                      camera.getCameraControl()
                              .startFocusAndMetering(action);

                  } catch (Exception ignored) {
                  }
              }

              private void applyZoom(float scale) {
                  if (camera == null) {
                      return;
                  }

                  float currentZoom =
                          camera.getCameraInfo()
                                  .getZoomState()
                                  .getValue()
                                  .getZoomRatio();

                  float newZoom = currentZoom * scale;

                  float minZoom =
                          camera.getCameraInfo()
                                  .getZoomState()
                                  .getValue()
                                  .getMinZoomRatio();

                  float maxZoom =
                          camera.getCameraInfo()
                                  .getZoomState()
                                  .getValue()
                                  .getMaxZoomRatio();

                  newZoom = Math.max(
                          minZoom,
                          Math.min(maxZoom, newZoom)
                  );

                  camera.getCameraControl().setZoomRatio(newZoom);

                  updateZoomText();
              }

              private void updateZoomText() {
                  if (camera == null || zoomText == null) {
                      return;
                  }

                  try {
                      float zoom =
                              camera.getCameraInfo()
                                      .getZoomState()
                                      .getValue()
                                      .getZoomRatio();

                      zoomText.setText(
                              String.format(
                                      Locale.US,
                                      "%.1fx",
                                      zoom
                              )
                      );

                  } catch (Exception ignored) {
                  }
              }

              private float distance(MotionEvent event) {
                  float dx = event.getX(0) - event.getX(1);
                  float dy = event.getY(0) - event.getY(1);

                  return (float) Math.sqrt(
                          dx * dx + dy * dy
                  );
              }

              private void openGallery() {
                  android.content.Intent intent =
                          new android.content.Intent(
                                  MediaStore.ACTION_PICK_IMAGES
                          );

                  try {
                      startActivity(intent);
                  } catch (Exception e) {
                      android.content.Intent fallback =
                              new android.content.Intent(
                                      android.content.Intent.ACTION_VIEW
                              );

                      fallback.setType("image/*");
                      startActivity(fallback);
                  }
              }

              private void addSpace(
                      LinearLayout parent,
                      int dp
              ) {
                  View view = new View(this);

                  view.setLayoutParams(
                          new LinearLayout.LayoutParams(
                                  1,
                                  dp(dp)
                          )
                  );

                  parent.addView(view);
              }

              private int dp(int value) {
                  return (int) (
                          value *
                          getResources()
                                  .getDisplayMetrics()
                                  .density
                  );
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      @NonNull String[] permissions,
                      @NonNull int[] grantResults
              ) {
                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode == CAMERA_PERMISSION &&
                          grantResults.length > 0 &&
                          grantResults[0] == PackageManager.PERMISSION_GRANTED) {

                      startCamera();

                  } else {
                      Toast.makeText(
                              this,
                              "Camera permission is required",
                              Toast.LENGTH_LONG
                      ).show();
                  }
              }
          }
          EOF

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip
          unzip -q gradle-8.5-bin.zip

          ./gradle-8.5/bin/gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraPro-APK
          path: app/build/outputs/apk/debug/app-debug.apk
